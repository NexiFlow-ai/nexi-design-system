  # «Onboarding is the conversation» — proposed 2026-10-20 at UAT-2; adopted with
  # `APPROVED UAT-2` (owner, 11:57). Reused by S2 `request-access.json`: `interpret`
  #, `rate_limited` without *Try again*, `lines.done`
