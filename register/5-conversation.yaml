  # S0 (UAT-1 — proposed 2026-10-26 after `APPROVED 045-UAT-0`): two conversation components that point at
  # CR-ids through and; they change only through a Conversation Change Request (rule 35).
  - id: DS-5019
    name: Automation card
    owner: apps/chat
    component: "apps/chat/src/components/thread/AutomationCard.tsx#AutomationCard"
    stories: conversation-automation-card
    statement: >-
      The one card an ask with `automation_intent` gets, for every role: *Set up an automation?* with four
      lines — what it will do · *When* (the schedule read back in words, with the zone) · *Using* (the connection or
      data, named, with its state) · *Tells* (the asker, in the bell and this chat — (a); *everyone in ⟨Project⟩*
      as an option) — and *Review setup · Not now*. *Review setup* is a disclosure: the schedule as a `Select` (daily ·
      weekdays · weekly · custom under *Technical*), the time, the recipients, then *Not now · Confirm* (*Confirm and
      enable* for a builder). Then the card **is the summary** — its face a `role=status` chip line: *Draft — enable in
      Configure* · *Awaiting a builder* · *Enabled · next run ⟨when⟩* · *Paused* / *Paused — archived by ⟨name⟩* · *Needs
      changes — "⟨note⟩"* — with each run's receipt beneath (*07:02 · 3 changes · View*). Honesty: an unexpressible
      schedule asks for a time it can run and drafts nothing; a missing connection is named with its door and the face
      stays *Draft*; a missing template is said; **nothing runs until a human enables it**. Actions by role
      builders *Pause · Change · Open in Configure*; members *Change · Stop asking*. Offline: *Confirm* `aria-disabled`
      with the reason.
    states: [proposed, unexpressible, reviewing, draft, needs-connection, awaiting, enabled, with-receipts, paused, paused-archived, needs-changes, template-unavailable, offline]
    a11y: "a `region` labelled by its title; *Review setup* carries `aria-expanded`; the schedule `Select` and the time field are labelled; the face is text in a chip (`role=status`), never colour alone; the receipts are a list; the card stacks at 200 %"
    copy: ["automation.card.*", "automation.face.*", "automation.schedule.*", "automation.unexpressible"]
    source: [" 08-UX_UAT", "…", "", "", "", "", "", "", "", ""]
    status: adopted

