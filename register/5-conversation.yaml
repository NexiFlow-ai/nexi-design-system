      The projection of the one card into a messenger: what the renderer makes
      of every register card state when the executor face is a Telegram private chat — the answer (the web's text,
      the receipt's source count, `[n]` kept, *Open in Nexi* under every card) · *typing* then one progress message
      edited in place · the long answer as its gist and the door · a table or figures as one line and the door · the
      stages of a goal or a Flow ticking in one edited message with Pause · Stop · Resume exactly when the web's card
      has them · the next line as ≤ 3 buttons · an artifact as its title line · approvals as Approve · Reject · Open
      with a second tap, or the door only above the inline level · the connect ask · the route confirm · the not-found
      line with no door · the generic line for a state the table lacks, never silence · the voice read-back, the
      spoken gist as a voice bubble, the audio-file fallback · the file lines · the queue, rate and unavailable lines
      · the stranger's offer · the link, the cues, the picker, the proactive lines, disconnect, revoked. Rendered
      through `TelegramPreview` — the workshop's monochrome mock of a chat (no Telegram asset, tokens only) so the
