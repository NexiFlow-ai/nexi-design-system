    statement: >-
      A quoting document in the Canvas: the Request as five blocks A–E, every fact with
      its source; the Draft as lines that name their kind (reported · calculated · tariff · observed · TBC) and their
      basis in words; the reply beside its Ukrainian original with the same TBC marks. Its states are the Canvas's:
