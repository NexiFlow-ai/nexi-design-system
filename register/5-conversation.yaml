    stories: conversation-briefing
    statement: >-
      Under a new chat's hero composer, at most three honest lines (amends 's *nothing to click first*
      (a)): a title (*Since yesterday* / *Since ⟨day⟩*) with a trailing *Briefing · on* ⚙; each line a
      `ProviderMark` (a connected account) or the app's accent glyph (a NEXUS item) · one sentence ≤ 120 chars whose
      entity is a link · one action — *Ask* (the sentence becomes this chat's first turn with the item's refs as
      grounding; never a prefilled message) or *Open* (the bell's deep link) · a *Dismiss* ✕ on hover/focus. **The
      section is absent when there is nothing** — no *nothing new* line. NEXUS lines are deterministic from the person's
      inbox and work read models; connected-account lines (Gmail · Microsoft 365 · Atlassian · Dropbox) are read
      just-in-time **as the person**, read-only, last 24 h, ≤ 20 items, cached 15 min, one model sentence each flagged
      `llm_proposed`, **Personal chat only** and **on by default for every consented connection** — the ⚙ sheet
      turns a connection off (*Show in briefing*) or the whole thing (*Turn off the briefing*). Loading draws the title
      and three skeleton lines only after the composer is usable; a failed read is silent; offline shows cached lines
      *as of ⟨time⟩*.
