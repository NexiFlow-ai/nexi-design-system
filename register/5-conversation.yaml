# · Design System Register · band 5 — Conversation components (DS-5xxx): NexChat's thread, composer, cards,
# approvals and canvas. Each row points at the Conversation Register (CR-xxxx) that defines the *behaviour*; this band
# holds only the *look* (states · tokens · a11y). A row's stories document `CR-` states with the fixtures the
# `/uat/components` catalogues used — no behaviour change; a change found necessary is a Conversation Change Request
#. The first ten rows landed at S3-A under.
band: 5
title: Conversation components
lead: "NexChat's components: the look is here, the behaviour is in the Conversation Register. The turn card, the goal on it, the Artifacts Library and its dialogs, and the quoting scenes arrived at S3-A; the composer, the thread, approvals and the Canvas follow in S3-B."
rows: # ---------------------------------------------------------------- the one turn card - id: DS-5001 name: Turn card owner: apps/chat component: "apps/chat/src/components/thread/TurnCard.tsx#TurnCard" stories: conversation-turn-card statement: >- One component renders every executor — agent · knowledge · data · search · research · Flow · resolver · goal — from one contract. The header line is *‹title› · ‹who/what› · ‹elapsed or when›*, the title an executor's label and never an id. A plain answer is prose in the thread with no frame; work longer than the threshold shows **one** folded progress line that unfolds into the staged view and becomes the receipt with the result beneath it; a turn has at most one progress indicator. The eight states are closed, one copy class and one visual each; an unknown state renders `failed`, never blank. `waiting_on_you` carries the decision inline in the same idiom for every executor. Typography and borders only; no second colour. S8: the card has a `lead` slot — what it already holds about the ask, rendered first in every state, before the progress line and any wait; the goal fills it with its Situation strip (DS-5002), no other executor uses it yet. states: [asked, working, waiting_on_you, waiting_on_other, done, stopped, failed, nothing_found] a11y: "one polite live region per thread announces a state change once; the progress line is `role=progressbar` with `aria-valuetext` = the copy (—: it has no accessible name yet, (c)); every inline decision is reachable by Tab from the composer and runs on Enter; Esc does nothing destructive" copy: ["turn.state.*", "turn.ask.*", "turn.decide", "turn.in_progress", "turn.created_so_far", "turn.want_details", "turn.superseded"] source: [" ", "", "…2006", "",, ""] status: adopted proof: conversation-turn-card--done - id: DS-5002 name: Goal card owner: apps/chat component: "apps/chat/src/components/thread/GoalCard.tsx#GoalCard" stories: conversation-goal-card statement: >- The goal is the eighth executor on the same turn card with the goal's parts in its slots: the plan with Accept · Change · Not now, the latest result as the body with earlier results folded beneath, the coverage line at completion, and the doors (view the plan · stop · pause · resume · open). The turn that opened the goal ends `done` while the goal continues; every later moment updates the same card — never a second card. The edges have no card of their own: a goal in another Project is not found exactly like any other not-found; an archived thread's card is read-only; a question to the running goal is prose in the thread. S8 adds two slots, no new card: the **Situation strip** above the plan — what NEXUS already holds about the subjects of the ask (NexSales · Vibeban · NexCare · artifacts · sources · the people on those records), each line a source word, the record's label and a door; one honest line naming the party when nothing was found; *not checked* for a source that did not answer; a record the person may not read is not a line and not a count — and the **Next line** at the proposal and at completion: 1–3 doors drawn only from found records, installed capabilities or the creation doors (*Create the account in NexSales* · *Add this request to Vibeban*), the colleague suggestion as a sentence then *Ask ⟨name⟩*, and the one question *What would you like me to do next?*. The same Next line (`NextLine`, bound by `NextLineTurn`) is drawn under a plain General or Knowledge answer that named a party (, (a)) — from the server's `turn_view.next` · `person`, never from the answer's words; *Ask ⟨name⟩* and *Add this request to Vibeban* create the one Vibeban item as the person and the receipt names it (*Asked Dana — the item is in Vibeban.* · *Open the item*). A drafted artefact's approval ask shows its security table (reads · writes · reaches) and the approval-required line when it reaches out. states: [asked, working, waiting_on_you, waiting_on_other, done, stopped, failed, nothing_found] a11y: "as DS-5001; the plan's steps are a list, the decisions are buttons in Tab order; earlier results fold under a disclosure button with `aria-expanded`; the Situation strip is a list whose doors are links in Tab order; the Next line is one `nav` landmark labelled *Next*; the security table is a definition list" copy: ["goal.*", "turn.state.*", "turn.ask.*", "turn.next.*"] source: [" ", "", "…", "", DS-5001, "", "", "", "", "", "…"] status: adopted proof: conversation-goal-card--the-journey # ---------------------------------------------------------------- the Artifacts Library - id: DS-5003 name: Artifacts library owner: apps/chat component: "apps/chat/src/components/artifacts/ArtifactsLibrary.tsx#ArtifactsLibrary" stories: conversation-artifacts-library statement: >- A Project's artifacts as the builders' rows grouped by day (DS-3035 rows, DS-3019 toolbar, DS-7010): title · type · origin · status pill · by whom · when. The controls row (search · type · by) appears from twelve rows, pages of fifty with *Show more*; a reader sees published rows only, no *New artifact*, no pills. The empty Project is the chat EmptyState with the one *New artifact* button for a writer and a sentence for a reader; loading · error · offline are the kit's state views (DS-3040 · DS-3042), an empty search offers the knowledge search. Each row's `⋯` holds what the person's rights and the artifact's origin allow — absent, never disabled. states: [populated, few, many, reader, empty_writer, empty_reader, loading, error, offline, empty_search] a11y: "a `table` with a caption per day group; the row menu is a named `menu` opened from a labelled `⋯` button; *Show more* is a button that announces the new count" copy: ["artifacts.*", "artifact.status.*", "artifact.row.*"] source: [" S0-R2-UX", "", "", DS-3035, DS-3019, DS-3040, DS-3042, DS-7010, ""] status: adopted proof: conversation-artifacts-library--eighteen-as-writer - id: DS-5004 name: Artifact row menu owner: apps/chat component: "apps/chat/src/components/artifacts/artifactModel.ts#rowMenuItems" stories: conversation-artifacts-library statement: >- The `⋯` of an artifact row (DS-3005 menu): Open · Open source chat · Publish · Add to dashboard · Rename · Archive… · Restore in sections, each item present only when the rights and the origin allow it — a reader sees Open and Open source chat; an owner of an archived chart sees Restore; a published document the person did not write offers no Rename. Nothing is disabled: an item that cannot run is not there. states: [own_draft_writer, published_writer, published_owner, archived_owner, notebook_writer, reader] a11y: "`role=menu` named after the row's title; items are `menuitem` buttons; ↑ ↓ move, Esc closes and returns focus to the `⋯`" copy: ["artifacts.row.*"] source: [" S0-R2-UX", "", DS-3005, ""] status: adopted proof: conversation-artifacts-library--row-menus - id: DS-5005 name: New artifact dialog owner: apps/chat component: "apps/chat/src/components/artifacts/NewArtifactDialog.tsx#NewArtifactDialog" stories: conversation-artifacts-library statement: >- *New artifact* is the Flow door: the intent composer with *Ask NEXUS*, beneath it *Start with an empty document* and *Start with an empty table*. One dialog (DS-7015 floating surface), one primary; an empty start names the new artifact *Untitled document 1* / *Untitled table 1*. states: [open, asking, empty_document, empty_table] a11y: "a named `dialog`; focus lands in the composer; Esc cancels and returns focus to *New artifact*" copy: ["artifacts.new", "artifacts.new.ask", "artifacts.new.untitledDocument", "artifacts.new.untitledTable"] source: [" S0-R2-UX", "", "", DS-7015, ""] status: adopted proof: conversation-artifacts-library--new-artifact - id: DS-5006 name: Publish artifact dialog owner: apps/chat component: "apps/chat/src/components/artifacts/PublishArtifactDialog.tsx#PublishArtifactDialog" stories: conversation-artifacts-library statement: >- Publish to the Project (DS-7004 confirmation): the artifact's name in the title, one sentence on who will see it, and the KNOWLEDGE line read as the person — *captured* · *capture is off* · *NexGraph cannot be read* · *checking…* — never a mechanism word. The verb is on the primary. states: [knowledge_on, knowledge_off, graph_unavailable, checking] a11y: "a named `alertdialog`; the knowledge line is `role=status`; Publish is the primary, Cancel first in Tab order" copy: ["artifacts.row.publish", "artifact.publish.knowledge.*", "artifact.publish.recorded"] source: [" S0-R2-UX", "", DS-7004, ""] status: adopted proof: conversation-artifacts-library--publish-knowledge-captured - id: DS-5007 name: Archive artifact dialog owner: apps/chat component: "apps/chat/src/components/artifacts/ArchiveArtifactDialog.tsx#ArchiveArtifactDialog" stories: conversation-artifacts-library statement: >- Archive… (DS-7004 confirmation): the name in the title, two sentences (what happens · what does not), the *Used by* line naming the dashboards and tasks that hold it — or that the owning app could not be asked — and the verb on the primary. Reversible: the archived row offers Restore. states: [default, used_by_unavailable] a11y: "a named `alertdialog`; *Used by* is a list; Archive is the primary, Cancel first in Tab order" copy: ["artifacts.row.archive", "artifact.archive.*", "artifact.archived.toast"] source: [" S0-R2-UX", "", DS-7004, ""] status: adopted proof: conversation-artifacts-library--archive-dialog - id: DS-5008 name: Project artifacts door owner: apps/chat component: "apps/chat/src/components/artifacts/ProjectArtifactsDoors.tsx#ProjectMenuScene" stories: conversation-artifacts-library statement: >- The Project's door to its artifacts, with no tab of its own: the Project name menu (● ‹name› ▾) carries *View artifacts · ‹n›* after *Project details*; the details line repeats the count with the same door. states: [menu, details_line] a11y: "a `menu` opened from the Project name button; the count is text, not a badge alone" copy: ["artifacts.title", "artifacts.by"] source: [" S0-R2-UX", "", DS-3005, ""] status: adopted proof: conversation-artifacts-library--project-doors # ---------------------------------------------------------------- supply-chain quoting - id: DS-5009 name: Quote document view owner: apps/chat component: "apps/chat/src/components/quote/QuoteArtifactView.tsx#QuoteArtifactView" stories: conversation-quoting statement: >- A quoting document in the Canvas: the Request as five blocks A–E, every fact with its source; the Draft as lines that name their kind (reported · calculated · tariff · observed · TBC) and their basis in words; the reply beside its Ukrainian original with the same TBC marks. Its states are the Canvas's: empty · loading · a document that could not be read (named) · not found (the Project's 404, byte for byte the same for another legal entity's request) · offline (the last saved version with a banner). Margin, markup and the sale price are part of no view. states: [populated, empty, loading, error, not_found, offline] a11y: "an `article` named after the document; embedded tables are real tables with headers; the offline banner is `role=status`" copy: ["quote.empty.*", "quote.turn.*.title", "quote.reply.title", "quote.handoff.title"] source: [" 08", "OS-2401…2406", "", "", ""] status: adopted proof: conversation-quoting--request-empty - id: DS-5010 name: Quoting scenes owner: apps/chat component: "apps/chat/src/components/quote/QuoteCatalogue.tsx#DraftApproval" stories: conversation-quoting statement: >- The six quoting conversations as compositions of DS-5001 (the Flow executor) and DS-5009: a one-line request (working 3 of 5 · the receipt and the Request); a packing list (facts from cells, one conflict kept, an unreadable photo named); the draft (the approval card with the document beneath its question — *Change a line* → a reason → *Approve*); the gate (stopped · who decides · which documents · under which edition; a person clears with a reason); the reply and its options (a language `tablist`; *Reply is right* → *Reply ready*); the formula sheet in the agent's instructions (change a line · run the golden cases · publish only when all pass); the hand-off (a draft in the known order of steps and a task for the operator — nothing is written). states: [intake, packing_list, draft, gate, reply, sheet, handoff] a11y: "every decision is a button on the card; the language switch is a `tablist` with roving tabindex; the golden-case receipt is `role=status` with pass/fail as text, not colour" copy: ["quote.turn.*", "quote.gate.*", "quote.reply.*", "quote.sheet.*", "quote.notes.*"] source: [" 08", "OS-2401…2406", "", DS-5001, DS-5009, ""] status: adopted proof: conversation-quoting--the-draft