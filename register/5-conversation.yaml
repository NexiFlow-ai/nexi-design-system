# · Design System Register · band 5 — Conversation components (DS-5xxx): NexChat's thread, composer, cards
# approvals and canvas. Each row points at the Conversation Register (CR-xxxx) that defines the *behaviour*; this band
# holds only the *look* (states · tokens · a11y). A row's stories document `CR-` states with the fixtures the
# `/uat/components` catalogues used — no behaviour change; a change found necessary is a Conversation Change Request
#. The first ten rows landed at S3-A under.
band: 5
title: Conversation components
lead: "NexChat's components: the look is here, the behaviour is in the Conversation Register. The turn card, the goal on it, the Artifacts Library and its dialogs, and the quoting scenes arrived at S3-A; the composer, the thread, approvals and the Canvas follow in S3-B."
rows:
  # ---------------------------------------------------------------- the one turn card
  - id: DS-5001
    name: Turn card
    owner: apps/chat
    component: "apps/chat/src/components/thread/TurnCard.tsx#TurnCard"
    stories: conversation-turn-card
    statement: >-
      One component renders every executor — agent · knowledge · data · search · research · Flow · resolver · goal —
      from one contract. The header line is *‹title› · ‹who/what› · ‹elapsed or when›*, the title an
      executor's label and never an id. A plain answer is prose in the thread with no frame; work
      longer than the threshold shows **one** folded progress line that unfolds into the staged view (
      ) and becomes the receipt with the result beneath it; a turn has at most one progress
      indicator. The eight states are closed, one copy class and one visual each; an unknown state renders
      `failed`, never blank. `waiting_on_you` carries the decision inline in the same idiom for every
      executor. Typography and borders only; no second colour.
      S8: the card has a `lead` slot — what it already holds about the ask, rendered first in every
      state, before the progress line and any wait; the goal fills it with its Situation strip (DS-5002), no other
      executor uses it yet.
    states: [asked, working, waiting_on_you, waiting_on_other, done, stopped, failed, nothing_found]
    a11y: "one polite live region per thread announces a state change once; the progress line is `role=progressbar` with `aria-valuetext` = the copy (—: it has no accessible name yet, (c)); every inline decision is reachable by Tab from the composer and runs on Enter; Esc does nothing destructive"
    copy: ["turn.state.*", "turn.ask.*", "turn.decide", "turn.in_progress", "turn.created_so_far", "turn.want_details", "turn.superseded"]
    source: [" ", "", "…2006", "",, ""]
    status: adopted
    proof: conversation-turn-card--done

  - id: DS-5002
    name: Goal card
    owner: apps/chat
    component: "apps/chat/src/components/thread/GoalCard.tsx#GoalCard"
    stories: conversation-goal-card
    statement: >-
      The goal is the eighth executor on the same turn card with the goal's parts in its slots:
      the plan with Accept · Change · Not now, the latest result as the body with earlier results folded beneath,
      the coverage line at completion, and the doors (view the plan · stop · pause · resume · open). The turn that
      opened the goal ends `done` while the goal continues; every later moment updates the same card — never a
      second card. The edges have no card of their own: a goal in another Project is not found exactly like any
      other not-found; an archived thread's card is read-only; a question to the running goal is prose in the thread.
      S8 adds two slots, no new card: the **Situation strip** above the plan — what NEXUS
      already holds about the subjects of the ask (NexSales · Vibeban · NexCare · artifacts · sources · the people on
      those records), each line a source word, the record's label and a door; one honest line naming the party when
      nothing was found; *not checked* for a source that did not answer; a record the person may not read is not a
      line and not a count — and the **Next line** at the proposal and at completion: 1–3 doors drawn only from found
      records, installed capabilities or the creation doors (*Create the account in NexSales* · *Add this request to
      Vibeban*), the colleague suggestion as a sentence then *Ask ⟨name⟩*, and the one question *What would you like
      me to do next?*. The same Next line (`NextLine`, bound by `NextLineTurn`) is drawn under a plain General or
      Knowledge answer that named a party (, (a)) — from the server's `turn_view.next` · `person`
      never from the answer's words; *Ask ⟨name⟩* and *Add this request to Vibeban* create the one Vibeban item as
      the person and the receipt names it (*Asked Dana — the item is in Vibeban.* · *Open the item*). A drafted
      artefact's approval ask shows its security table (reads · writes · reaches) and the approval-required line
      when it reaches out.
    states: [asked, working, waiting_on_you, waiting_on_other, done, stopped, failed, nothing_found]
    a11y: "as DS-5001; the plan's steps are a list, the decisions are buttons in Tab order; earlier results fold under a disclosure button with `aria-expanded`; the Situation strip is a list whose doors are links in Tab order; the Next line is one `nav` landmark labelled *Next*; the security table is a definition list"
    copy: ["goal.*", "turn.state.*", "turn.ask.*", "turn.next.*"]
    source: [" ", "", "…", "", DS-5001, "", "", "", "", "", "…"]
    status: adopted
    proof: conversation-goal-card--the-journey

