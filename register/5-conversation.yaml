    statement: >-
      One line of a room shared by many (S6, (a)): a face (one letter of the name, or the
      person's picture the host already holds; the wordmark for Nexi), the name and the time on one line, the words
      beneath as paragraphs in the reading column, the suite's rhythm. In a room nobody's words are a bubble — the
      reader's own line is a line too (every line is somebody's to the others). A mention (`@Nexi`, a member) is a
      quiet mark in the words, never a link. Under a line that has a thread: the chip — the faces, *n replies · last
      reply when* — the host opens. **Nexi's line** (`NexiRoomLine`) is the same shape with the stages edits in
      place: *Nexi is working…* with the trace (or the stage and its elapsed time), then the answer with its receipt
      (*from n documents*) and the door *Open in Nexi*; the gist past the room's limit; the audience line (*Waiting on
      Olena.*,) and the ceiling line as one sentence; in the channel it names whom it answers (*asked
      by Olena*). The line to a person who is not connected carries the one button *Connect Nexi account*.
      No card, no shadow, no colour but the brand's mark on Nexi's face. **S7:** a line that has no
      thread yet carries a quiet door at the right of its name — *Reply in thread* — on hover or focus (always on
      touch); a line that has a thread keeps its chip instead; a line on its way has neither.
