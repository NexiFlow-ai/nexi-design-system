  - id: DS-5015
    name: Scripted dialogue
    owner: packages/ui
    component: "packages/ui/src/ask/ScriptedDialogue.tsx#ScriptedDialogue"
    stories: conversation-scripted-dialogue
    statement: >-
      A conversation whose every line is closed content a human reviewed — a script of steps (text · chips · confirm)
      with validations and retry lines, en = uk, in the `nexus-scripted-dialogue-v1` format shipped as pack content
      (`packs/nexus-base/intake/*.json`) — rendered with the kit's thread and composer (DS-2008 line composer, the
      Ask turns): Nexi asks one question at a time; the person answers in the composer or taps a chip; a refused
      answer gets the step's retry line and the same question (never a form error, never a red field); the
      confirmation turn repeats what was said with *Create* · *Change*; *Change* offers the answered questions as
      chips and returns to the confirmation after the one answer; the host's `onSubmit` is the page's one write — a
      field the server refused (`422 code`) re-asks that step with its retry line; offline and other errors are one
      honest line and *Try again*, nothing created. No model reads an answer; the hook
      (`useScriptedDialogue`, a pure reducer) owns the state and never a fetch. Δ3: rendered in the one
      conversation frame (DS-5018 — the header says the intent, the turns are NexChat's own, the composer at the
      bottom); the speaker toggle and the browser's `speechSynthesis` are gone (a voice is the host's clip,; the
      intake has none).
    states: [asking, answered, refused, confirming, changing, submitting, server_refused, offline, failed, in_the_frame, handed_over, typed_into_chip, typed_unreadable, rate_limited, receipt]
    a11y: "the dialogue is a `section` named by the host; the thread is one `log`; one polite live region announces Nexi's newest line once; chips are real buttons in a `group` named by the question, in Tab order; the composer is the kit's (`role=search`, Enter sends, Shift+Enter a newline); the speaker is a toggle button with `aria-pressed`, disabled with a reason when the language has no voice; a refused answer is announced through the live region"
    copy: ["dialogue.placeholder", "the script's own lines (pack content, en = uk)"]
    source: [" C-K-1", "", "", "SC-0495…0496", " S2 ", "", "", DS-2008, DS-7017]
    status: adopted
    proof: conversation-scripted-dialogue--confirming

  # Δ3 (; owner 2026-10-22 10:58 — «the first message must be from Nexi like a message in chat … /request has
  # the old design, it must work the same approach — the UI must be maximum reusable, it is just a different intent»)
  - id: DS-5018
    name: Conversation frame
    owner: packages/ui
    component: "packages/ui/src/ask/ConversationFrame.tsx#ConversationFrame"
    stories: conversation-conversation-frame
    statement: >-
      The one shape of every Nexi dialogue outside an organization — the lobby (`/welcome`, DS-5016) and the request
      intake (`/request`, DS-5015) are the same surface with a different intent. Four things and nothing else: the
      header (the Nexi wordmark, DS-1061, and one line of context the host writes — *Acme Logistics · Invitation* ·
      *Start with Nexi* · *Request access*; the state word is the page's `h1`, never drawn), the thread growing from
      the top exactly as NexChat draws it — Nexi's lines as NexChat's assistant message (`NexiTurn` =
      `.nexus-message-assistant`: prose, no name, no mark), the person's as NexChat's bubble (`PersonTurn` =
      `.nexus-message-user`, right-hand, with the quiet *Spoken* mark when dictated,), the same 28px rhythm
      the foot (the kit's line composer, DS-2008, pinned at the bottom, and whatever the dialogue puts
      beside it: a receipt, a wave while a voice is in the room), and one polite live region. The host's `main` is
      `.nexus-convo-page` — the viewport: the header stays, the composer stays, the thread scrolls between them. Without
      a context the header is absent (a dialogue inside a page of the shell — Prepare an organization). No word above
      the thread, no toggle, no link, no decoration. Presentational: the dialogue owns the turns; the host owns the page.
      ** (b)** (owner 2026-10-24 20:11): the frame scrolls as NexChat's thread does (DS-5003) — the frame spans
      the viewport and the thread is the **one scrolling box**, so its scrollbar sits at the viewport's edge, never
      beside the words; the header, the composer and the words keep the reading column (`--nexus-composer-max-width`)
      centred by their own margins; the thread's tail passes *behind* the composer's band (the mask
      `--nexus-convo-tail-mask`, a 72px band, `--nexus-convo-tail-band`) with the band's room beneath the last line,
      and a new turn scrolls the thread to its very end — nothing cramped against the composer, no inner scrollbar.
      The finish scene of DS-5016 takes the thread's place in the frame.
    states: [direct_visit, invitation, request_access, longer, turn_not_sent, inside_the_shell]
    a11y: "a `section` named by the host; the header holds the wordmark (`role=img` *Nexi*) and the context line; the title is a visually hidden `h1` announced once on change; the thread is one `log` with no control in it, Nexi's and the person's turns distinguished as in NexChat (a reader hears the bubble's text as the person's own words sent, Nexi's as the answer); one polite live region; the composer is the kit's"
    copy: ["the host's context line (lobby.context.* · core.request.intake.title)", "the dialogue's lines"]
    source: [" Δ3", "", "", "", "", DS-1061, DS-2008, DS-5003, DS-5015, DS-5016]
    status: adopted
    proof: conversation-conversation-frame--interaction

  # «Nexi in the lobby» — proposed 2026-10-21 at UAT-1; awaits the design-system
  # owner's word with `APPROVED UAT-1`.
  - id: DS-5016
    name: Lobby thread
    owner: packages/ui
    component: "packages/ui/src/ask/LobbyThread.tsx#LobbyThread"
    stories: conversation-lobby-thread
    statement: >-
      The one surface a signed-in person with no organization meets: a title that follows the conversation's state
      the wave + speaker (DS-5013), the thread of Nexi's
      lines and the person's lines (a dictated one marked), the kit's composer (DS-2008) with its mic, and one
      permanent text door (*I have a code*). Δ1: **no chip, no button** — every answer
      the approval included, is typed or spoken into the one composer; the final step is Nexi's read-back of
      everything she will do and the person's *all good*, the composer named *Answer Nexi* while it waits
      after the commit the screen becomes **voice mode** — the thread folds, the wave is the screen, Nexi speaks the
      receipt and the same words are written beneath it, with the link to the request under `by_request` (
      ); in the open contour the hand-over to the welcome thread follows (DS-7017). The voice is the host's
      clip from chat-api's `voice-*` door — never the browser's
      `speechSynthesis`; the kit draws the speaker toggle and the wave. Nexi opens with the most specific truth the
      engine read; a knowledge answer is a turn with its
      provenance word; validation is a line Nexi says, never a red field; the tool's working line and the
      wave while it runs. Presentational: the host owns every turn and the clip; nothing here fetches, decides or
      interprets; the model's prose arrives as text. Δ2 (owner's brief 2026-10-22, — «Contextual
      conversational activation»): **four things and nothing else** — the header (the Nexi wordmark and one line of
      context the host writes from the opening: *Acme Logistics · Invitation* · *Start with Nexi* · *Panama · New
      organization*), the thread growing from the bottom (the person's words on screen the moment they are sent; `*a
      word*` drawn as emphasis, never a control; the one progress is the line *Nexi is writing…* beside the suite's
      trace — the accent dot travelling its line, the same identic as NexChat's turn (DS-5001; owner 2026-10-23 —
      pink tried and returned to the accent, 19:49)), the kit's one-line
      composer pinned at the bottom, and the wave **only while a voice is in the room** (Nexi speaking · voice mode).
      Gone: the drawn title (the state word stays for assistive technology), the speaker toggle, the code door, the
      request link, the decorative wave. A turn that did not go through keeps the words in the composer and says so in
      one line (`note`); sending again is the retry. Δ3: drawn in the conversation frame (DS-5018) — the thread
      grows from the top in NexChat's own turns: Nexi's as prose, the person's as the bubble. **The door**
      the same surface for a stranger at `/request` on the lobby engine in visitor
      mode — the header *Request access* → the organization's name once said, the engine's closed opening, a knowledge
      answer with its provenance word, the eight facts of the request in any order and one read-back, the closing line
      after *all good* (the composer folds; the landing follows), and the closed script as the fallback with one honest
      line. Written only: no voice, no wave, no form, never a 429. **** (owner 2026-10-23 21:42, a–h): a line of
      Nexi's is drawn as its **paragraphs** (the answer · the engine's provenance line · the resumed ask) — the
      provenance is the engine's one line in the text, the caption beneath is gone (e · f); the walk is **driven** by
      the engine's lines (h): *Now — back to your request.* after a detour, *We have 5 of 8 — … to go.* after two empty
      turns, *That's everything I need.* before the read-back; `handed_over` is the receipt and **one line** — *Opening
      your chat…* — and the host moves on (Δ5 d · h6: a new owner → NexChat's `/chat/welcome`, where Nexi's first
      message opens; a request → the landing); no thread on the page, no Overview, no link. ** (a)** (owner
      2026-10-24 20:11 — «the finish is a voice that fills the screen»): both ways, the door and the lobby, the finish
      is one **scene** — after the commit the thread folds away and the page is the wave (`VoiceWaves` the height of
      the frame between the header and the words, its grain following the canvas), Nexi speaks the finish line (the
      door's: the thanks, the team has it, the confirmation to {email}, the invitation by mail once the team has read
      it — `receipt.door`; the lobby's: its receipt) and the same sentences stand beneath, centred (`--nexus-text-2xl`);
      `handed_over` is the same scene with the wave **quiet** (muted ink) and the host's one line under the words
      (*Opening your chat…* · *Back to nexiflow.ai in a moment*); no composer, no thread, no link. The visitor's door
      may ask for this one clip of its own thread; without a clip the scene is written only
      never a fake voice. The wave while a voice is in the room during the walk (the lobby's 36px band under the
      composer) is unchanged.
