# · Design System Register · band 4 — Shared surfaces (DS-4xxx): `@nexus/app-shell` (NexusShell · ShellDock ·
# AppLauncher · CommandPalette · SettingsSheet · OfflineStrip · ConnectedAccounts · UatControlsDrawer · VoiceDock),
# `@nexus/ui` artifacts (ChartArtifact · TableArtifact · DocumentCanvas · ArtifactCard), `@nexus/ui/flow` (FlowCanvas),
# `@nexus/ui/scene` and `@nexus/ui/ask`. Rows land at S1 with their stories.
band: 4
title: Shared surfaces
lead: "The shell, the artifacts, the Flow canvas, the scene and the Ask surface — the Ask rows arrived at S3-A with NexChat's stories; the shell · artifacts · Flow canvas · scene rows are owed and land first in S3-B."
rows: # ---------------------------------------------------------------- @nexus/ui/ask - id: DS-4001 name: Ask bar component: "@nexus/ui/ask#AskBar" stories: conversation-ask-surface statement: >- NexChat's composer line minimised into a host app's header: `+` (attach) · the text field with the app's own placeholder · the mic · `↑` (send) / Stop while running; the panel toggle with its unread dot when an answer arrived closed. One line, the control height of the header (DS-1004), never a second chat input in any app (DS-2008). Offline disables send and says so in the field; disabled is a state, not a hidden bar. states: [empty, composing, running, offline, disabled, unread] a11y: "`role=region` named *Ask ‹app›*; the field is a labelled textbox; Enter sends, Shift+Enter breaks a line; Stop is a real button; the mic reports its outcome in the live region" copy: ["ask.placeholder.*", "ask.region", "ask.stop", "ask.panel.toggle", "ask.panel.unread"] source: [" ", "", "", DS-2008] status: adopted proof: conversation-ask-surface--the-bar-in-every-host - id: DS-4002 name: Ask surface component: "@nexus/ui/ask#AskSurface" stories: conversation-ask-surface statement: >- The bar and its panel as one surface: the panel opens beneath the bar with the conversation for this screen, the answer turns rendered by NexChat's own turn card (DS-5001), the hand-off chip and *Back to ‹app›*. Its states are closed: empty · composing · streaming · answered · answered from the screen · not on the screen · unreadable · an action proposed (the proposal card with Confirm · Change · Cancel) · action done · error · denied · offline · no destination · no route. Each state has one copy class per language; nothing in the panel names a mechanism. states: [empty, composing, streaming, answered, answered_from_screen, not_on_screen, unreadable, action_proposed, action_done, error, denied, offline, no_destination, no_route] a11y: "the panel is a named `dialog`-less region with one polite live region for the answer; Esc and × close and return focus to the bar; the proposal's three decisions are reachable by Tab in order" copy: ["ask.state.*", "ask.action.*", "ask.new", "ask.continue", "ask.no_destination", "ask.chip.unavailable"] source: [" ", "", "", "", "", DS-2008, DS-7011] status: adopted proof: conversation-ask-surface--answered