# · Design System Register · band 7 — Patterns (DS-7xxx): how the kit is composed into the screens the suite
# repeats. A pattern names its components and the rows it rests on; its proof is a composition story (S0: the kit's
# own compositions; S2–S3: a screen story per app).
band: 7
title: Patterns
lead: >- Ten compositions cover nearly every screen in the suite. A new screen names the pattern it follows in its acceptance criteria; a screen that follows none proposes an eleventh.
rows: - id: DS-7001 name: Discovery list → Inspector statement: >- A page lists records in a `DataTable`; selecting a row opens the `Inspector` on the right with the record's properties and sections; Enter / double-click drills into the record's own page when it has one. The list keeps its selection and scroll while the panel is open; one Inspector at a time. components: [DS-3030, DS-3031, DS-3032, DS-3017] rests_on: [DS-2007, DS-0005] source: ["", ] status: adopted proof: kit-datatable--selectable - id: DS-7002 name: Create in the Inspector statement: >- *New …* in the header line opens a `FormInspector` empty; the form fills it; Submit in the footer creates the record and the panel becomes its detail Inspector. No separate "new" page, no modal. components: [DS-3033, DS-3010, DS-3011] rests_on: [DS-2007] source: [" R4"] status: adopted proof: kit-inspector--form - id: DS-7003 name: Edit in place statement: >- A detail surface reads by default; Edit turns its properties into controls; Save commits and shows *Saved*; Cancel on a dirty form asks inline. Switches commit on change without an Edit mode. components: [DS-3016, DS-3006, DS-3012, DS-3017] rests_on: [DS-0007] source: ["", ] status: adopted proof: kit-editbar--read - id: DS-7004 name: Confirmation statement: >- Reversible: an `ActionPanel` where the action was taken, one sentence naming the effect, one primary, Cancel. Destructive: the same panel with `danger`, a typed name and a `danger` primary. Never "Are you sure?". components: [DS-3034, DS-3001] rests_on: [DS-0007] source: [] status: adopted proof: kit-editbar--confirmation - id: DS-7005 name: The state ladder on every read statement: >- A screen's content region renders through `DataStateView`; loading is text, empty is quiet with ≤ 3 starting points, error and offline retry, denied and not found look alike. Tables render their own ladder inside the body. components: [DS-3043, DS-3040, DS-3041, DS-3042, DS-3030] rests_on: [DS-0005, DS-0006] source: [] status: adopted proof: kit-states--ladder - id: DS-7006 name: Overview page statement: >- A `wide` frame: the `PulseStrip` on top, a row of `Stat`s, then `Section`s with `StatusList`s and *View all →* links. Monochrome; no pie, no dashboard tiles with their own colours. components: [DS-3020, DS-3052, DS-3051, DS-3022, DS-3055, DS-3053] rests_on: [DS-2004, DS-0002] source: ["R2–"] status: adopted proof: kit-pageframe--sections - id: DS-7007 name: Settings surface statement: >- Settings are a `PropertyList`: one quiet row per property with the control as the value; grouped by `InspectorSection idiom="rule"` when there are more than six. No form cards, no helper paragraphs. components: [DS-3017, DS-3032, DS-3011, DS-3012] rests_on: [DS-0004] source: [""] status: adopted proof: kit-properties--properties - id: DS-7008 name: Empty collection statement: >- A collection with nothing in it shows the quiet `EmptyState` in place of the list: one title, the primary action the header line also offers, up to three starting points. A table header is never left bare. components: [DS-3041, DS-3030] rests_on: [DS-0005] source: [, " AC-3"] status: adopted proof: kit-states--quiet - id: DS-7009 name: Two-level page statement: >- Tabs for the first level, a `SideNav` column for the second, the content to its right; the active section in the URL. Never a tab row inside a tab panel. components: [DS-3023, DS-3024] rests_on: [DS-2006] source: [] status: adopted proof: kit-navigation--left-nav - id: DS-7010 name: List with controls statement: >- Above a collection that outgrows one screen: a `Toolbar` with a `SearchField`, compact `Select` filters and the primary action on the right; below the threshold the header line is the whole chrome. A filtered-to-empty list says what it filtered and offers *Clear filter*. components: [DS-3019, DS-3014, DS-3011, DS-3030, DS-3041] rests_on: [DS-0004] source: [] status: adopted proof: kit-forms--toolbar-row - id: DS-7011 name: Ask round trip statement: >- From any app's Ask bar a question goes to chat-api as that app's Project; the answer appears in the Ask panel with its provenance line; a hand-off opens NexChat with the *asked from* chip and *Back to <app>* returns. The conversation itself is governed by the Conversation Register (CR-xxxx), not here. components: ["@nexus/ui/ask#AskSurface"] rests_on: [DS-2008] source: ["", ""] status: adopted proof: conversation-ask-surface--action-proposed # ---------------------------------------------------------------- from the S1 style census - id: DS-7012 name: Link idioms statement: >- Three looks for three jobs: an *inline* link in running text (text colour, underlined, hover → secondary); a *row* link — the title cell of a table or row list (no underline, underline on hover, the row is the target); a *meta* link at 12 px secondary (*Open source chat*, *Why?*). A `<button>` that looks like a link is the inline look over a button with a 24 px target; a fourth tone, *quiet* (13 px · 500 · secondary, underline on hover), is the look of an action row (DS-7016). One class family `.nexus-link` (`.is-row` · `.is-meta`) and `.nexus-link-btn` (`.is-meta` · `.is-quiet`); nothing app-local. components: [DS-3030, DS-3035, DS-3063] rests_on: [DS-0001, DS-0004] source: ["UX-AUDIT",, ] status: adopted proof: kit-links--inline - id: DS-7013 name: Filter panel statement: >- When a list needs more than three filters, they leave the toolbar for a panel above (a wrapping row of labelled compact selects and chips, 12 px label over each) or beside the list; the toolbar keeps search and the primary action. Active filters show as removable chips with *Clear all*; a filtered-to-empty list says what it filtered. NexBI's `.nexus-bi-fbar` promoted; DS-7010 stays the ≤ 3 case. components: [DS-3019, DS-3014, DS-3003, DS-3041] rests_on: [DS-7010] source: ["UX-AUDIT",, " NexBI", ] status: adopted proof: kit-forms--filters - id: DS-7014 name: Form rhythm statement: >- Label (12 px · 500 · secondary) · 6 px · control (34 px, 13 px) · 6 px · hint or error (12 px); 16 px between fields; a two-column grid at 16 × 24 for short fields; a titled fieldset 24 px from its neighbours. One control height in a form (34), 32 in a toolbar, 40 only on the sign-in card. The focus ring is the accent ring token. "Wrong" is said once: the field's border and a `Hint tone="danger"` under it, linked by `aria-describedby`. `.nexus-field` (margin-based) is legacy. components: [DS-3010, DS-3011, DS-3012, DS-3013, DS-3014, DS-3015, DS-3036] rests_on: [DS-1011, DS-0004] source: ["UX-AUDIT",, ] status: adopted proof: kit-forms--rhythm - id: DS-7015 name: Floating surface statement: >- One anatomy for everything that floats over the page — a menu, a popover, the composer picker, a select's list: radius 12 · padding 6 · 1 px border · `--nexus-shadow-md` · items 32 px with 8 px inset and radius 8 at 13 px · separators 1 px with 4 px around · captions 12 px secondary; the picker adds a search row and sections, the popover glass. It names its layer (DS-1031), opens from its trigger's corner, closes on Escape and outside click, and returns focus. A select has three sizes — form 34 · toolbar 32 · quiet 26 — and its option hint is a prop, never hidden from outside. components: [DS-3005, DS-3014, DS-3060] rests_on: [DS-1031, DS-1020] source: ["UX-AUDIT",, ] status: adopted proof: kit-menu--floating-surface - id: DS-7016 name: Action rows statement: >- Secondary actions under content are a quiet row of links, never a row of buttons: 13 px · 500 · secondary colour · underline on hover · a `·` between · baseline-aligned under the text, 8 above. *View plan · Pause · Change goal · Stop* under a goal card; *Connect Gmail · Not now* in the sentence that names the obstacle; the footer of an inspector section, a row's expansion, a result line, the recovery line of a state. A bordered button keeps three jobs only — the one primary commit of a surface, a confirmation's pair, the header or toolbar line's named actions. A destructive action in a row is the last link, named by its verb, never red — it confirms by name. One component renders the row (`ActionRow` of `LinkButton tone="quiet"`); nothing app-local. components: [DS-3063, DS-3001, DS-3034] rests_on: [DS-0002, DS-0004, DS-0007, DS-7012] source: ["CONSISTENCY-AUDIT ·",, "owner 2026-10-10 18:42 — the goal card's working · a first result"] status: adopted proof: kit-links--quiet-action-row