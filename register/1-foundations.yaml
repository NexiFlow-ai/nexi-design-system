# · Design System Register · band 1 — Foundations (DS-1xxx). The tokens themselves live in
# `packages/ui/src/tokens.css` and reach the workshop through `tokens-to-stories.mjs`; a row here names a *group* and
# its rule, never a value. `proof` is the Storybook story id that renders the group.
band: 1
title: Foundations
lead: >-
  Colour, type, radius, the shell's measures, surfaces and motion — 101 tokens in eight groups, read from
  `tokens.css` by the workshop so the page can never drift from the CSS.
rows:
  - id: DS-1001
    name: Neutrals
    statement: >-
      Background, subtle, muted, surface, raised, text (primary · secondary · muted), border (default · strong),
      focus, and the one accent with its ring and soft tint. Both themes define every neutral; a component names the
      token, never the hex.
    tokens: "--nexus-bg … --nexus-accent-soft"
    source: [, ""]
    status: adopted
    proof: design-system-foundations--neutrals

  - id: DS-1002
    name: Semantic colour
    statement: >-
      Error, warning, success, info — four values, used sparingly, always with a label or an icon that carries the
      same meaning. They tint a chip's dot or an inline alert; they never fill a surface.
    tokens: "--nexus-error · --nexus-warning · --nexus-success · --nexus-info"
    source: []
    status: adopted
    proof: design-system-foundations--semantic

  - id: DS-1003
    name: Attention accents
    statement: >-
      Mint, pink, sky, amber, green, violet, slate, coral, copper, teal, steel, each with a soft tint. They identify an
      application in the launcher and may mark one running or selected thing on a screen. Never navigation chrome,
      never a chip, never text colour — **an application's glyph inside its own launcher tile may take its accent**
      .
    tokens: "--nexus-accent-mint … --nexus-accent-steel-soft"
    source: [,, "owner 2026-09-21 (Graph violet)", " ((a))"]
    status: adopted
    proof: design-system-foundations--accents

  - id: DS-1004
    name: Per-application accents
    statement: >-
      Each application owns one accent pair (`--nexus-app-<app>-accent` · `-soft`) mapped to an attention accent.
      A new application claims a free pair in its UAT-0 and the scaffold writes it; two neighbours in the launcher
      never share a hue. Ten pairs: chat mint · spin pink · tasks amber · bi sky · graph violet · core slate · map green ·
      care coral · forge copper · sales teal · **factory steel**.
    tokens: "--nexus-app-chat-accent … --nexus-app-factory-soft"
    source: [,, " "]
    status: adopted
    proof: design-system-foundations--app-accents

  - id: DS-1005
    name: Data palette
    statement: >-
      Eight categorical hues and one sequential ramp (`--nexus-data-1 … -8`, `--nexus-data-seq-1 … -5`) for things
      that are *data* — NexForge colour keys, NexBI series, NexMap layers, NexGraph hues — defined once in both
      themes with ≥ 3:1 against the surface. An app never picks its own chart colour; the attention accents
      (DS-1003) are not a data palette.
    tokens: "--nexus-data-1 … --nexus-data-seq-5 (new) · --nexus-on-data (WP-10: type on a solid data colour, paper in both themes)"
    source: ["UX-AUDIT",, ]
    status: adopted
    proof: design-system-foundations--data-palette

  # owner 2026-10-19 07:38 — "APPROVED DS-1006 (крок А)": the nexiflow.ai pink becomes the suite's brand colour
  - id: DS-1006
    name: Brand colour
    statement: >-
      One brand colour, the pink of nexiflow.ai (`--nexus-brand`: #c9336f in Light — the landing's #d43a78 one step
      deeper so 11 px text clears 4.5:1 on the warm white — and #f07aa6 in Graphite; `--nexus-brand-soft` its wash).
      It carries exactly one thing: the **application name after the wordmark** (`Core` · `VibeBan` · `Graph` · `Docs`
      … — `.nexus-cc-sidebar-app` in every app's brand row, `.nx-brand-app` in NexiDocs), as "Flow" is pink on the
      landing. The wordmark `Nexi` stays graphite; buttons, favicons, the sign-in doors, navigation chrome and the one
      accent (DS-1001) keep their tokens. Whether the one accent itself becomes the brand colour is a separate register
      question (step B, open); the attention pink of NexSpin (DS-1003 · DS-1004) is not the brand colour.
    tokens: "--nexus-brand · --nexus-brand-soft"
    source: ["owner 2026-10-19 (nexiflow.ai)", DS-1061, "owner 2026-10-23 19:49: the trace dot tried in pink, returned to the accent"]
    status: adopted
    proof: design-system-brand-mark--shell-with-app

  - id: DS-1010
    name: Type
    statement: >-
      One family (`--nexus-font`: Inter, system fallback), three weights (400 · 500 · 600), seven sizes with one
      line-height each (`--nexus-text-xs … -3xl` = 11 · 12 · 13 · 14 · 16 · 20 · 26): `md` 13 is the workbench body
      `lg` 14 the reading body, `2xl` 20 the page title, `xl` 16 the Inspector
      head and the composer, `sm` 12 chips · labels · hints, `xs` 11 the eyebrow and the counter. No half pixels,
      nothing under 11, no italic for emphasis, no all-caps except the section title and the eyebrow.
    tokens: "--nexus-font · --nexus-text-xs … --nexus-text-3xl · --nexus-leading-xs … -3xl · --nexus-composer-font-size · --nexus-composer-placeholder-size"
    source: ["", "",, ]
    status: adopted
    proof: design-system-foundations--type

  - id: DS-1011
    name: Spacing
    statement: >-
      Ten steps — 2 · 4 · 6 · 8 · 12 · 16 · 20 · 24 · 32 · 48 px (`--nexus-space-1 … -10`): inside a control · icon
      to label · chip inset · the action gap · a field's gap · section inner · page head · between sections · page
      padding · the page's foot. Margins, paddings and gaps name a step, never a number; 10 and 14 do not exist
      (8/12, 12/16). A quiet control that must sit flush with its text uses `.is-flush`; off-screen text uses
      `.nexus-sr-only`, never a negative margin.
    tokens: "--nexus-space-1 … --nexus-space-10 (new) · --nexus-action-gap = space-4 · --nexus-page-pad · --nexus-section-gap · --nexus-inspector-pad"
    source: ["UX-AUDIT",, "STYLE-CENSUS", ]
    status: adopted
    proof: design-system-foundations--spacing

  - id: DS-1020
    name: Radius
    statement: >-
      Seven radii — `xs` 4 (the inner corner: a chip, a swatch, a focus ring) · `control` 6 (the 34 px input, the 32 px
      toolbar control, a menu item) · `sm` 8 (button, card) · `md` 12 (panel, floating surface) · `lg` 16 (sheet) · `xl`
      20 (dialog, launcher) · `pill` 999 (counter, status chip) — plus the composer's own 26 px. A `border-radius` is one
      of these names; `--nexus-radius` = `sm`.
    tokens: "--nexus-radius-xs · -control · -sm … -xl · -pill · --nexus-radius · --nexus-composer-radius"
    source: ["",, ]
    status: adopted
    proof: design-system-foundations--radius

  - id: DS-1021
    name: Shell measures
    statement: >-
      The grid every app shares: 52 px rail, 52 px bar, 248 px sidebar (36 / 34 px rows), a 32 × 44 px collapse
      handle, 32 px rail buttons, 36 / 28 px button heights, 8 px action gap, 400 px drawer, 440 px confirm, 720 px
      composer, 800 px content. A screen that needs another measure proposes a token.
    tokens: "--nexus-sidebar-* · --nexus-bar-height · --nexus-btn-height* · --nexus-action-gap · --nexus-drawer-width · --nexus-confirm-width"
    source: [,, " AE", ""]
    status: adopted
    proof: design-system-foundations--layout

  - id: DS-1030
    name: Surfaces and elevation
    statement: >-
      Borders separate; two shadows exist (the composer's and the floating `lg`) and only what floats — the
      composer, a menu, a dialog, the launcher — may use them. Glass and overlay tokens are the only translucency;
      the overlay blurs 12 px.
    tokens: "--nexus-surface* · --nexus-glass-* · --nexus-overlay-* · --nexus-shadow-lg · --nexus-composer-shadow*"
    source: [""]
    status: adopted
    proof: design-system-foundations--surfaces

  - id: DS-1031
    name: Layers and shadows
    statement: >-
      Nine layers, each a token: raised 1 · sticky 10 · dock 20 · drawer 30 · popover 40 · menu 50 · dialog 60 ·
      toast 70 · skip-link 100 (`--nexus-z-*`); a floating surface names its layer and never a number. Three shadows:
      `sm` (a hovered row or dragged block) · `md` (a menu, a picker, a popover) · `lg` (a dialog, the launcher) —
      the literal `0 18px 50px …` that twelve rules carry today becomes `md`. The same three heights exist as
      `filter` values (`--nexus-lift-sm · md · lg`, S3-B WP-10) for an SVG element that lifts with `drop-shadow`
      where `box-shadow` cannot reach — NexForge's sticker at rest · hovered · dragged.
    tokens: "--nexus-z-raised … --nexus-z-skip (new) · --nexus-shadow-sm · --nexus-shadow-md (new) · --nexus-shadow-lg · --nexus-lift-sm · --nexus-lift-md · --nexus-lift-lg (WP-10)"
    source: ["UX-AUDIT",, DS-1030,, "S3-B WP-10 (scene.css at 0)"]
    status: adopted
    proof: design-system-foundations--layers

  - id: DS-1040
    name: Motion
    statement: >-
      One shell transition (`--nexus-shell-motion`, 200 ms cubic-bezier(0.2, 0, 0, 1)); a progress pulse of
      600–900 ms on the Pulse strip and the run bar; the fold of a thread into its receipt line
      (`--nexus-receipt-fold`, 900 ms — DS-5014); `prefers-reduced-motion` turns all three off.
    tokens: "--nexus-shell-motion · --nexus-receipt-fold"
    source: [, "PulseStrip R2", " S2 "]
    status: adopted
    proof: design-system-foundations--motion

  - id: DS-1050
    name: Iconography
    statement: >-
      Lucide only, 14 px inside a button or a row, 16 px on its own; always `aria-hidden` — the accessible name is on
      the control. Status is never an icon alone. No emoji in product UI. **An icon is Lucide; a provider's logo is a
      `ProviderMark` (DS-3066)** — the one place a third party's glyph and colour appear.
    source: ["lucide-react (OSS-CHAT-02)", DS-0001, " "]
    status: adopted
    proof: kit-button--icon-only

  - id: DS-1060
    name: Breakpoints and the reference viewport
    statement: >-
      Designs are judged at 1440 × 900. One breakpoint matters to the kit: under 720 px the Inspector becomes a
      sheet, the side navigation stacks above its content, and the header line wraps its chips and actions under
      the title. Below 480 px the shell is NexChat's phone layout.
    source: [, " ", " phone"]
    status: adopted
    proof: kit-pageframe--long-title

  - id: DS-1061
    name: The brand mark and the wordmark
    statement: >-
      The platform is **Nexi**; its mark is `BrandMark` in `@nexus/ui` — a stroked N whose diagonal is a curve, with a
      dot at its centre (the nexiflow.ai glyph). **The N is `currentColor` at the stem weight of the type beside it
      (stroke 3.2 on the 32 grid; 3.4 in the wordmark); the dot is the brand colour (`--nexus-brand`, DS-1001) and
      stands free of the diagonal — a ring is cut out of the stroke around it, so the surface shows through** (the
      owner's word 2026-10-27, variant C of the three shown; the all-ink mark with the thin N is retired everywhere:
      every app, NexChat, the marketing site, NexiDocs, the Keycloak door, the favicons, Spin's DS-6900 copies). The
      wordmark is **one word whose capital is
      the glyph**: `BrandWordmark` draws the N at cap height on the baseline and `exi` in the row's bold type (16 px in
      the shell, 26 px on the doors) — never a mark beside a typed `Nexi`. Expanded shell brand row (`.nexus-brand`,
      the brand is the launcher): the wordmark; every app follows it with its name in tracked uppercase in the
      brand colour (DS-1006), NexChat ends the row with the Search icon. Collapsed rail: the bare glyph in a 32 px target. The unauthenticated
      doors (NexCore sign in · sign up · verify · welcome): the wordmark alone as the h1. Every application's favicon:
      the glyph white on a graphite rounded square, the dot in the Graphite brand pink (`src/app/icon.svg`). The letter N stays in the DOM, visually hidden,
      so assistive technology reads "Nexi". Applications keep their short names (NexChat · NexCore · NexBI · NexTasks ·
      NexMap · NexCare · NexSales · NexForge · NexGraph); the wordmark is never translated and never written in capitals
      in copy (`Nexi`, not `NEXI`). Identifiers stay `nexus` (`@nexus/*`, `.nexus-*`, `nexus://`).
    components: ["@nexus/ui#BrandMark", "@nexus/ui#BrandWordmark", "@nexus/app-shell#ShellBrand"]
    source: [,, "the owner 2026-10-27 (the pink dot, variant C; «like proposed logo and identica let's move forward» 17:40 — approved)"]
    status: adopted
    proof: design-system-brand-mark--shell

  # S0 — proposed 2026-10-17 with the design-system owner's APPROVED
  - id: DS-1062
    name: Status glyphs
    statement: >-
      The only emoji the suite's copy may carry are four status glyphs with a fixed meaning: **✓** done · approved ·
      connected; **✗** failed · rejected; **⏸** paused; **🎤** a voice note read back. They open a line (*✓ Connected
      to …*), never decorate one, and never stand alone — the sentence says the state in words too (never colour or
      glyph alone, DS-3003). No other pictograph appears in a `turn.*`, `goal.*`, `channel.*` or app copy key; the
      copy-fitness tests scan for it. Exclamation marks are not copy. The glyphs are
      the text characters, drawn by the platform's font — never an image, never a Telegram sticker.
    source: [" 08", "", "", "", DS-3003]
    status: adopted
    proof: conversation-channel-rendering--all
