  - id: DS-6710
    name: Import panel
    owner: apps/factory
    component: "apps/factory/src/components/parts/ImportPanel.tsx#ImportPanel"
    stories: apps-nexfactory-import
    parent: DS-3007
    statement: >-
      Settings › Import: a file of records becomes a *batch* the person
      reviews, tries, commits and may undo as a whole. **File**: the record type, the Project (one of the person's,
      ), a CSV or JSON file ≤ 2 MB / 5 000 rows — *Preview* uploads it once; the bytes are never kept, only the
      derived rows. **Review**: the proposed mapping per column (a ranker over column names — never a model; every
      candidate with its score is shown, the person's `Select` is final), the counts *new · update · rejected* as
      chips, the rejected rows with the reason per field, the first rows with their state as a word. *Dry run* reports
      what a commit would write and writes nothing (the batch stays previewed); *Commit* asks once (`ActionPanel`)
      and writes. **Recent batches**: every batch with its state as a word (*previewed · committed · undone · partly
      undone*), its counts, and *Undo* on a committed one — created rows removed, updated rows restored; a row another
      actor edited since is named and stays (`ROLLBACK_PARTIAL`), never silently overwritten. A reader sees the recent
      batches and a `Restriction`; in the connected world the door says the owner is external and offers nothing. Not
      a kit duplicate: the kit has no upload-review-commit-undo ladder.
    states: [file, previewing, review, dry-run-done, confirming, committing, committed, undone, partly-undone, rejected-file, external-owner, read-only, recent-empty]
    a11y: "the file input is a labelled `Field` with a hint; the mapping and rows tables carry captions and `th scope=row`; every target `Select` is named *target for {column}*; errors are `role=alert`; the panel is `aria-busy` while a door runs; the confirm is the kit's `ActionPanel`"
    copy: ["factory.import.*", "factory.recordType.*", "factory.action.discard"]
    source: [" S3-ARCHITECTURE S3-G", "", "", "", ""]
