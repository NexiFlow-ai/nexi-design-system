      Flutter. The kit `@nexus/ui` is **not** imported (Flutter cannot
      one rule for all). What applies instead is the **brand**: every token of `packages/ui/src/tokens.css` is exported
      by `nexus/scripts/brand/export-tokens.mjs` to `spin/brand/tokens.json` (Light · Graphite · the spacing, type,
      radius and control scales; the source's sha256 pinned), and the fork's `scripts/spin-brand.mjs` derives Buzz's
      theme layers from that file — the shadcn variables (`--background` ← bg · `--foreground`/`--primary` ← text ·
      `--muted`/`--accent` ← bg-subtle/bg-muted · `--destructive` ← error · `--border` ← border · `--ring` ← the one
      accent · `--chart-n` ← data-n · `--radius` ← radius-sm) and the Flutter `ColorScheme`s (`tertiary` = the accent)
      never edited by hand; `just brand --check` is the drift test. The rules travel with the tokens:
      black · white · graphite · one accent (selected · running · focus) · no gradient · no decorative skin (what Buzz
      draws beyond the brand is removed, not restyled); typography, spacing and borders over colour; the
      state ladder (DS-7006) on every screen; the copy rules of DS-0xxx (no mechanism in copy · not-found sameness ·
      uk = en — Buzz ships `en` only, the fork adds `uk` to every client); the a11y contract (44 px targets · AA
      contrast · visible focus · live regions for new messages). Spin screens are stories in the fork's own workshop
      (`desktop/` Storybook) and Flutter goldens (`mobile/test/goldens`, 390 × 844, Light and Graphite) — the fork's
      UAT-1, mirrored here as `spin-brand` (the tokens as swatches, the two themes, the drift test's output). Not a kit
      duplicate: nothing of the kit renders in Spin; the row exists so the brand has one owner and one source.
    states: [light, graphite, drift-ok, drift-failed]
    a11y: "the brand carries the kit's contract into the fork: AA contrast of every mapped pair (text/bg · text-muted/bg · error/bg · accent/bg ≥ 3:1 as a ring), 44 px targets on mobile, focus visible as the accent ring, new messages announced politely; the fork's goldens and the VoiceOver/TalkBack walk are the proof"
    copy: ["spin.* (the fork's own catalogue, en + uk)"]
    source: [" 00-EPIC B", "", "", "", "", "", "", "AGENTS.md UX"]
    status: proposed

