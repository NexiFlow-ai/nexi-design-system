  - id: DS-6918
    name: Question review card
    owner: apps/tasks
    component: "apps/tasks/src/components/inbox/QuestionReviewCard.tsx#QuestionReviewCard · QuestionReviewLive.tsx#QuestionReviewLive"
    stories: apps-nextasks-question-review-card
    parent: DS-7010
    statement: >-
      The reviewer's one screen for a `question_batch` approval (S5 · ·
      ): the Inbox card idiom with a table as its body, opened from the Inbox as a *resource page* (
      `?review=⟨approval_id⟩`; seven columns do not fit the Inspector's 440 px, and a `?open=` deep link is sent on to
      the page). Head: *Review ⟨n⟩ questions · ⟨section⟩*, the source's classification chip, the requester and the time —
      on the page the one header line (`←` · title · chip · Ask) carries the title and chip and the card keeps the meta
      line (`chrome="page"`). Body: the row table (DS-3030) — *id · lang · category ·
      question · gold facts · gold page · decision*. *question* is read-only text in the row's language (that is the
      job); *gold facts* is the count with a ✓ when the validator found every phrase verbatim, *negative* for a row
      without gold; *gold page* is the page id, a door to the page as ingested when the app has one; *decision* is a
      `keep | drop` segmented choice (DS-3065's radio group, default keep) with the reason `Select` (DS-3011) beside a
      drop — `not_answerable_from_page · ambiguous · duplicate · wrong_section · bad_gold`. Twins sit adjacent; a
      decision on one never moves the other. Foot: the validator's line (*Validator: 0 problems · 4 negatives · twins
      consistent*), then *Reject* and *Approve ⟨kept⟩ · Drop ⟨dropped⟩*; a drop without a reason is a row the batch
      cannot close on — Approve waits with *1 drop needs a reason* beside it, never a bare disabled button. Approve
      writes every row's pick (`decision.rows[]`) and closes; Reject declines the batch whole (no row, no record —
      a). The requester sees the picks read-only and *You cannot review your own batch*; an expired
      batch is the standard expired line; a decided batch shows the picks read-only with who and when and the tally.
      The text of a question lives only in the approval's payload: never in a pick, an event or a log.
    states: [populated, page-chrome, drop-needs-reason, loading, error, permission-denied, expired, decided, offline]
    a11y: "a `h2` title (the page line's `h1` in page chrome); the table is the kit's with a caption; one row has focus (roving, `aria-selected`, outlined) and `↑/↓` move it, `k` keeps, `d` drops and moves focus into the reason, `r` opens the reason of a dropped row, `⌘⏎` / `Ctrl⏎` approves (`aria-keyshortcuts` on Approve); every decision cell is a native radio group with a hidden legend naming the row; the reason is the kit's combobox named *Reason for dropping ⟨id⟩*; a waiting Approve is `aria-disabled` and described by its reason; the decided line is `role=status`; refusals in tasks-api's words as `role=alert`"
