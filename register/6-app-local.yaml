# · Design System Register · band 6 — App-local components (DS-6xxx): components one application owns because
# no other needs them (NexBI's chart blocks, NexGraph's evidence rail, NexMap's layers, NexCare's queue, NexForge's
# canvas, VibeBan's board). A row here is the proof the component is *not* a kit duplicate. Rows land at
# S2–S3 app by app.
band: 6
title: App-local components
lead: "What one application owns on purpose. Rows arrive at S2–S3, one application at a time."
rows:
  # ---------------------------------------------------------------- NexSales
  - id: DS-6101
    name: Source chip
    owner: apps/sales
    component: "apps/sales/src/components/parts/SourceChip.tsx#SourceChip"
    stories: apps-nexsales-source-chip
    statement: >-
      Where a record lives and how fresh the copy is, next to its title: `NEXUS` for a native record; *from ‹provider›
      · ‹age›* for an external one read moments ago; *stale · ‹age›* when the last read is old; *‹provider›
      unavailable* when the source does not answer. Built on `Chip` (DS-3003) with the four semantic tones; glyph +
      text, never colour alone; the tooltip carries the exact verification time. Not a kit duplicate: the kit's Chip
      has no notion of provenance or age.
    states: [native, live, stale, unavailable, waiting, unavailable-since]
    a11y: "the chip text is the status; the time is a `title` on a focusable span; *waiting* is a `role=status` live region"
    copy: ["sales.source.nexus", "sales.source.from", "sales.source.stale", "sales.source.unavailable", "sales.source.verifiedAt", "factory.source.*"]
    source: [" 08-UX §", "", " "]
    status: adopted

  - id: DS-6102
    name: Save ladder
    owner: apps/sales
    component: "apps/sales/src/components/parts/SaveLadder.tsx#SaveLadder"
    stories: apps-nexsales-save-ladder
    statement: >-
      The honest state of one write, in the log composer's footer (DS-6107; a FormInspector's footer elsewhere —
      amended 2026-10-11): draft · saving · waiting for ‹provider› · pending
      approval (names the approver) · saved (said only when the source confirmed and returned an id) · rejected (names
      the field) · conflict (mine · theirs; *Keep mine* · *Take theirs* · *Merge*) · reconciling · not saved (*Try
      again*) · ‹provider› unavailable · denied (read-only record type). A dot + sentence (`StatusDot`, DS-3004 —
      WP-1, 2026-10-29); the recovery actions are one `ActionRow` of quiet links under the sentence (DS-7016);
      `role="status"`, polite for the quiet states, assertive for the ones that need a hand. Not a kit duplicate: `EditBar` (DS-3033) has
      editing/saving only; the ladder is the write-through contract of a system of record.
    states: [draft, saving, pending_external, pending_approval, saved, rejected, conflict, reconciling, not_saved, unavailable, denied]
    a11y: "`role=status` · `aria-live` polite/assertive by state; the three conflict actions are real buttons (`LinkButton` renders a `button`)"
    copy: ["sales.ladder.*"]
    source: [" 08-UX §", "…", ""]
    status: adopted

  - id: DS-6103
    name: Sales Today (Overview page)
    owner: apps/sales
    component: "apps/sales/src/components/screens/TodayScreen.tsx#TodayScreen"
    stories: apps-nexsales-today
    statement: >-
      Today is an instance of the **Overview page** (DS-7006, the NexCore cockpit — amended 2026-10-11 twice: the
      owner found three columns overloaded, then asked for the NexCore Overview idiom): a `wide` frame with the health
      line in the header (`StatusDot` + small age, as NexCore's *operational*); the **Sales pulse** frame (`PulseStrip`
      — Accounts ─ Opportunities ─ Quotes waiting ─ Follow-ups, each a door; `live` when the provider is connected; the
      foot line: planned · waiting · overdue · going quiet); three `Stat`s (planned today · open pipeline as money ·
      going quiet, with overdue as the toned delta); then two `nexus-cc-two` rows of `Section`s — *Planned today*
      (`StatusList`: account · kind · contact · time, row → account with the Log composer open) · *Waiting on me*
      (the attention list: title · account · assignee · due, dot red when overdue, the task reference as the door to
      NexTasks) · *Going quiet* (`StatusList`: account · relationship · owner · *n d quiet*, amber ≥30 d, red ≥60 d)
      · *Recent* (the recent list: who · kind · account · outcome · ago). Only kit classes; no app-local stylesheet.
      The org-admin sees the pulse figures and the quiet empty state, never the lists.
    states: [populated-connected, populated-native, empty-setup-door, org-admin-d423, loading, error, denied, offline]
    source: [" 08-UX §J1", "", "", "DS-7006"]
    status: adopted

  - id: DS-6104
    name: Activity timeline
    owner: apps/sales
    component: "apps/sales/src/components/screens/AccountScreen.tsx#AccountScreen"
    stories: apps-nexsales-account-page
    statement: >-
      The account's activity stream (amended 2026-10-11): the log composer (DS-6107) at the top, then **Next** —
      planned interactions and open follow-ups in one list, soonest first — and **History**, done interactions newest
      first. One row grammar for both: a glyph (open = planned or follow-up, filled = done) · when · kind or title ·
      outcome chip · who · with whom · the summary · the next step with its follow-up door. The stream is the
      *Activity* view of the page; Deals · Quotes · Documents are its sibling views (`LocalTabs`, DS-2006). The
      source chip (DS-6101) on the page line says where these came from; when the source is unavailable the list
      stays, marked as the last copy. Not a kit duplicate: no kit export shows a dated sequence with a planned/done
      glyph. **Deals** lists the account's deals · requests · leads · tasks
      as work rows (DS-6109) read as the person off every board they hold, with the shut-door line first — never a
      sales table; *Quote this* on an open request opens DS-7002 *New quote* prefilled.
    states: [connected, native, stale, source-unavailable, empty, deals, deals-empty, deals-tasks-away, deals-no-board, deals-board-hidden, quote-from-request, quotes, documents]
    source: [" 08-UX §J2", "", "", " A2", ""]
    status: adopted

  - id: DS-6105
    name: Pipeline boards
    owner: apps/sales
    component: "apps/sales/src/components/screens/PipelineScreen.tsx#PipelineScreen"
    stories: apps-nexsales-pipeline
    statement: >-
      **The board is VibeBan's** (amended 2026-10-12 — A1 · (3); the owner: *"the pipeline must be a
      VibeBan capability, not a duplicate in the sales system"*): an opportunity is a VibeBan item of the pack's type
      on a *Pipeline* board (`nexus://tasks/project_template/sales-pipeline`), and the board — stages, cards, drag,
      limits, the sum — is NexTasks' own screen (DS-6201 card facts · rollups). NexSales draws no board: the screen
      is the projection sales-api composes as the person (`GET /sales/pipeline`) — one `DataTable` row per board
      (*board ↗ · key · open deals · pipeline sum*, `mixed` when the currencies disagree, *not yours to read* when
      the person may list but not read it), the row a door into NexTasks' Board tab (DS-7001; `↗` the owning app,
      ). No board → `EmptyState` with the one door *New board in NexTasks*
      NexTasks away → said as such. **Leads** and **Requests** are two more
      views of the same screen (`LocalTabs`, DS-2006): the open leads off the person's *Leads* boards
      (`nexus://tasks/project_template/leads`) and the open requests off their Pipeline boards, each a `DataTable`
      of work rows (DS-6109 words: key · title ↗ · the type's facts · stage · the quote a request became) and a door
      into the item; no Leads board → the one door *New Leads board in NexTasks* (quiet — the page's one primary is
      the Pipeline's). A lead converts into a deal in VibeBan, never here. The 2026-10-11 app-local
      board (columns · rails · drag · Shift+arrows · `⋯ Move to…`) is retired; its measures live in VibeBan's
      `.nexus-tasks-board`.
    states: [boards-connected, boards-native, boards-two, board-hidden, no-board, no-board-cannot-act, tasks-away, leads, leads-no-board, leads-tasks-away, requests, requests-empty, empty, loading, error, denied, offline]
    a11y: "a table with a caption; the board link says *opens in NexTasks* to a reader; the empty state's one action is a real link; the unavailable line is plain text, not an error"
    source: [" 08-UX §J5", "", " A1", " A1", ""]
    status: adopted

  - id: DS-6106
    name: Setup door
    owner: apps/sales
    component: "apps/sales/src/components/screens/SetupDoor.tsx#SetupDoor"
    stories: apps-nexsales-setup-door
    statement: >-
      The first screen of an empty organization: one question — start in NEXUS, or connect the system that already
      holds the customers — as two radio cards and one primary button. One door in; no wizard, no tour.
      Built on `EmptyState` (DS-3011) `variant="card"` with a `starting` list would hide the choice; the radio pair
      is the choice.
    states: [native-chosen, connect-chosen]
    a11y: "a `fieldset` with a legend; native radios; the button label changes with the choice"
    source: [" 08-UX §J9b", ""]
    status: adopted

  - id: DS-6107
    name: Log composer
    owner: apps/sales
    component: "apps/sales/src/components/parts/LogInteractionForm.tsx#LogInteractionForm"
    stories: apps-nexsales-log-composer
    statement: >-
      The interaction is written **in the activity stream**, not in a side panel (proposed 2026-10-11, replacing the
      S0 FormInspector — the owner found the page overloaded with the panel open). Closed, it is one quiet line at
      the top of *Activity* — `+ Log a call, a meeting or a note…`.
      Open, it is one bordered block: a head (title · `×`), one row of four compact fields — kind · contact · when ·
      outcome (`Field` + `Select compact`) — the summary (the only required field; its hint is the placeholder), an
      optional *Plan the next step* switch that reveals *next step · due*, and a footer where the save ladder
      (DS-6102) sits at the left and *Cancel* (`LinkButton`) · *Save* (`Button size="toolbar"`, the one primary of the
      composer — DS-7016, WP-1) at the right. The header's *Log
      interaction* opens the same composer. With AI off the last line says so (08). Esc closes while
      nothing is in flight; the composer closes itself once the source confirmed the write. Built on `Field` ·
      `Select` · `Switch` · `Button` · `LinkButton` · `IconButton` · `Hint`. Not a kit duplicate: `FormInspector` (DS-3032) is a
      panel; `EditBar` (DS-3033) has no fields.
    states: [closed-line, draft, saving, pending_external, saved, pending_approval, rejected, conflict, not_saved, unavailable, denied]
    a11y: "a `form` labelled by its title; the summary takes focus on open; the required field is announced on submit; Esc returns focus to the opener; the ladder is the `role=status` of the write"
    copy: ["sales.log.start", "sales.log.title", "sales.log.aiOff", "sales.form.*", "sales.ladder.*"]
    source: [" 08-UX §J3", "…", "", ""]
    status: adopted

  # DS-6108 *Composer-line door* (proposed 2026-10-12, (1)) was withdrawn the same day at the owner's walk-through
  # (: *"UI of quick creation looks so ugly … we always have the right nav for creating and reviewing
  # entities like in Graph, Care, BI"*). Every NexSales record door is DS-7002 *Create in the Inspector* — the form
  # first, the first field focused, the look-alike check on blur — rendered in `Apps/NexSales/Record doors`.
  # The id is not reused.

  - id: DS-6109
    name: Work rows
    owner: apps/sales
    component: "apps/sales/src/components/parts/WorkRows.tsx#WorkRows"
    stories: apps-nexsales-work-rows
    statement: >-
      **Deals, leads and requests are VibeBan's** (proposed 2026-10-13 — S2-B · A2
      ): one row grammar for every VibeBan item NexSales lists on the account page (*Deals* view) and the
      Pipeline screen (*Leads* · *Requests* views) — *key · title · the kind's facts · stage · amount · the door*
      . The rows are read as the person (`tasks.items.list` through sales-api); the
      title, the stage's name and every field are tasks-api's words, and what the person may not read is simply not
      there. A deal shows its `amount` and close date; a lead its company and channel, and
      *became a deal* with the deal's door once converted (`fields.converted_to`, the declared conversion of
      A5 — done in VibeBan, never here); a request what it wants by when and, once a quote answers it, the
      quote's title as a link (`fields.quote_ref`, written by sales-api as the person) — or *Quote this* while none
      does and the person may quote (the one door into DS-7002 *New quote*, prefilled; the quote carries
      `request_ref`). `WorkDoorState` is the honest line above the lists when the door is shut: NexTasks away ·
      no board yet · a board the person may list but not read (named
      `role=status`, not an error). Built on `EmptyState` · `StatusDot` · `Chip` · `Button`; the list is the
      `.nexus-sales-rows` grammar of DS-6104. Not a kit duplicate: no kit export lists typed items of a sibling app
      with their doors and a per-kind action. Never a NexSales record — no table, no cache, no stage of its own.
    states: [deals, requests, requests-read-only, leads, one-account, empty, tasks-away, no-board, board-hidden]
    a11y: "a list; every row's door is a real link naming the key to a reader; *Quote this* is a button; the shut-door line is `role=status`; the stage's tone is redundant to its name (DS-0001)"
    copy: ["sales.work.*", "sales.section.leads", "sales.section.tasks", "sales.leads.emptyBody", "sales.leads.newBoard", "sales.requests.emptyBody", "sales.quotes.forRequest"]
    source: [" 08-UX §J2 · §J5", "", "", " A2", " A5", "", ""]
    status: adopted
  # ---------------------------------------------------------------- S3-B WP-2…WP-6 (proposed 2026-10-11): the five
  # applications brought to the register — VibeBan · NexBI · NexMap · NexCare · NexCore. Each row names what the app owns
  # on purpose and is the proof the part is not a kit duplicate. Pending the owner's approval.

  - id: DS-6201
    name: Work-item glyphs and property fields
    owner: apps/tasks
    component: "apps/tasks/src/components/tasks/common.tsx#PriorityChip · StageDot · TypeGlyph · BlockedGlyph · HealthDot · ActorChip · DueLabel · ItemRow; DateField · EstimateField · EnterField · Description · ShowMore; FieldRows.tsx#FieldRows · FieldInputs · CardFacts · RollupLine; FieldSpecEditor.tsx#FieldSpecList · FieldSpecEditor"
    stories: apps-nextasks-parts
    statement: >-
      The atoms every VibeBan list, board card and Inspector row is built from. Priority (`‼ ! · ◦` + the word),
      stage (`○ ◔ ◑ ◕ ● ⊘`), type (epic · story · task · bug glyphs), blocked (`n` + direction), health (`StatusDot`
      with the word) — glyph + text, never colour alone. `ActorChip` is a human, an agent or a service with
      its kind; `DueLabel` says overdue · today · the date. The property fields are the Inspector's editors — bare at
      rest, framed on hover/focus (`quiet`), Enter commits, Esc reverts; `EstimateField` carries the project's unit.
      `ShowMore` is the page foot (*n of total · Show more*). **Typed item fields** (amended 2026-10-12
      S1-A4 · A4): a type's `fields[]` (text · number · money · date · choice · yes/no · reference) are
      Inspector rows under the built-in ones in the same quiet idiom (`FieldRows` — money is a number and a 3-letter
      currency; a reference shows its prefix and takes the id; a `financial` row is absent for a viewer, *Not set*
      for an editor); the create form shows them as `Field`s (`FieldInputs`, required marked, a problem named at its
      row); a board card carries up to three `show_on_card` values as a label-less facts strip (`CardFacts`, the
      label is the title — DS-6105's *account · amount · closes*); a column head says each `rollup: sum` once after
      the count pill (`RollupLine`; *mixed* when the currencies disagree). Settings › Types edits a type's fields
      (`FieldSpecEditor`: label en · uk, kind, key locked once saved, required / at a stage category, on the card,
      sum, sensitivity, a choice's options one per line, a reference's prefix; ≤ 16) and reads them as one quiet
      line each (`FieldSpecList`). Built on `Chip` (DS-3003), `StatusDot` (DS-3004), `Field` (DS-3020), `Select`,
      `Switch`, `PropertyRow` and `Menu` (DS-3005); not a kit duplicate — the kit has no notion of a work item's
      priority, stage, type, estimate or typed field.
    states: [glyphs, rows, fields, more, typed-fields, field-specs]
    a11y: "every glyph is `role=img` with an `aria-label` and a `title`; the fields are labelled inputs; a fact carries `aria-label` *label: value*; an unparsable value is `aria-invalid` with a `role=alert` line"
    copy: ["tasks.priority.*", "tasks.stage.*", "tasks.type.*", "tasks.health.*", "tasks.due.*", "tasks.palette.*", "tasks.fields.*"]
    source: [" 08-UX", "", "", " A4", " S1-A4"]
    status: adopted

  # ---------------------------------------------------------------- NexGraph (S3-B WP-7 · UAT-3 — proposed 2026-10-28 after
  # `APPROVED -B-WP7-UAT1`,). What NexGraph owns on purpose: the knowledge vocabulary (a claim's status, a tier
  # the human gate's inspectors), the evidence readers, and the Studio stage as it is today — the stage changes in the
  # Graph Studio slice, which amends DS-6003 before any code. = 2 (the raw `nexus-cc-*` class the kit's
  # own primitives emit through a pass-through), every other FIT CSS rule 0 for `apps/graph`. Pending the owner's word.

  - id: DS-6001
    name: Knowledge glyphs and inspectors
    owner: apps/graph
    component: "apps/graph/src/components/graph/common.tsx#Status · TierChip · VisibilityChip · MiniTable; ClaimInspector.tsx#ClaimInspector; MergeInspector.tsx#MergeInspector; GraphLegend.tsx#GraphLegend · StageStatus; TypeLegend.tsx#TypeLegend; SavedViews.tsx#ViewsMenu · SaveViewPanel"
    stories: apps-nexgraph-parts-common
    statement: >-
      The vocabulary every NexGraph list, Inspector and stage line is built from. `Status` is a claim's lifecycle
      as a
      `StatusDot` tone **and** the word, with the *platform* scope said when the claim is the platform's; `TierChip` is
      the knowledge tier (Project · platform) on `Chip`; ** S2 amendment:** `VisibilityChip` is a version's
      visibility on `Chip` — *Shadow* (`warn`: a candidate under measurement that no reader opens — its row is a name
      and the chip, no content door, no diff) · *Superseded* (`muted`: the live twin a shadow replaced at activation);
      a live version carries no chip; the same word sits beside a shadow run's state on the Pipeline list and the run
      page (`run-mode-shadow`), never "shadow mode"; `MiniTable` is the kit's `DataTable` as it is (: no cell
      override, numbers right-aligned, a `caption`). `ClaimInspector` is the human gate on one claim — the evidence
      passage, the model's proposal as a *proposed* fact with its model pin, **one primary** (*Verify*, opening the
      confirm `ActionPanel` that names the human scope and the closed reason codes) and *Return · Look again* as
      secondaries in an `ActionRow` (DS-7016); a question answered this sitting is *spent*; `MergeInspector` is the *same
      thing?* twin — two columns, the differing rows marked, *Same thing · Different* and the effects named before the
      POST. `GraphLegend` filters the stage by type with the counts; `StageStatus` is the stage's `role=status` line
      (*n of total shown · m lit · edges not drawn*); `TypeLegend` is the colour-cluster key; `ViewsMenu`
      and `SaveViewPanel` are a saved view's `Menu` (DS-3005) and its `ActionPanel` (name · what it keeps · replace).
      Built on `StatusDot` (DS-3004), `Chip` (DS-3003), `DataTable` (DS-3030), `Inspector` (DS-7010), `ActionRow`/
      `ActionPanel` (DS-7016), `Menu` (DS-3005); not a kit duplicate — the kit has no claim, no tier, no stage.
    states: [statuses, tiers, visibility, mini-table, claim-verified, claim-contested, claim-proposed, merge-open, merge-viewer, legend, stage-status, type-legend, views-menu, save-view, replace-view]
    a11y: "a status is text beside its dot, never colour alone; an Inspector is a `complementary` region that returns focus on close; the legend's filters are toggle buttons with `aria-pressed`; the stage line is `role=status`; the views menu is a `Menu` with roving focus"
    copy: ["graph.status.*", "graph.tier.*", "graph.visibility.*", "graph.claim.*", "graph.merge.*", "graph.legend.*", "graph.stage.*", "graph.views.*"]
    source: [" 08-UX–5", " G", "", "", "", "", "WP-7 · · ", " S2"]
    status: adopted

  - id: DS-6002
    name: Evidence readers
    owner: apps/graph
    component: "apps/graph/src/components/graph/Artifacts.tsx#ArtifactsGallery; VersionDiff.tsx#VersionDiffPanel; ProcessingConfig.tsx#ProcessingConfigInspector; RetrievalConfig.tsx#RetrievalConfigSections; EntityExplain.tsx#EntityExplain; DatasetPublish.tsx#TablePanel; DoorImage.tsx#DoorImage"
    stories: apps-nexgraph-parts-readers · apps-nexgraph-parts-processingconfig
    statement: >-
      The readers of what a run produced, each a door from a row or a bar, never a page of its own: `ArtifactsGallery`
      (the page renders as the parser saw them and every figure with the vision model's *proposed* words and its model
      pin — S12-d,); `VersionDiffPanel` (*what changed* between two versions — one sentence, before → after
      counts, the folded groups; the first version says everything is new); `ProcessingConfigInspector` (the
      active configuration version and its runs; an editor saves a draft, the owner activates; ** S1 amendment:**
      the same Inspector hosts `RetrievalConfigSections` — the resolver's eleven dials as a second *Active · Draft* pair with
      its own version line `rtp_…@N`, the one cross-field rule inline, *Activate for new answers* for the owner; its sections
      use the `rule` idiom, …1903 · …1903; ** S2 amendment:** a saved processing draft offers the
      owner *Run as shadow* beside *Activate* — a secondary door that orders one shadow run per live document and
      receipts the count; 409 `SHADOW_CAP` · `SHADOW_PENDING` speak in the owner's words; an editor sees neither door
      and one restriction line · · J2); `EntityExplain`
      (where an entity's relations come from, grouped by kind, the documents of an edge — S11c); `TablePanel` (a
      table's publish-as-dataset door — the series v1 · v2, verified, the address, revoke keeps the row — S7);
      `DoorImage` (an image that comes through a door with the credential — loading · failed · bytes). Each names the
      restriction a reader lacks as a `Restriction` line, never a greyed button. Built on `Inspector`
      `Facts`, `DataTable`, `ActionRow`/`ActionPanel`, `States`; not a kit
      duplicate — the kit has no artifact, no version, no configuration, no dataset series.
    states: [artifacts, table-publish, version-diff, processing-config, shadow-draft, shadow-refused, shadow-editor, retrieval-defaults, retrieval-draft, retrieval-invalid, retrieval-active, retrieval-viewer, retrieval-denied, entity-explain, door-image, door-refused]
    a11y: "a gallery is a list of `figure`s with `figcaption`; a diff's before → after is text, not an arrow glyph alone; a panel is a `dialog` or an Inspector section that returns focus; a refused door is a `Restriction` line, not `aria-disabled` chrome"
    copy: ["graph.artifacts.*", "graph.diff.*", "graph.config.*", "graph.retrieval.*", "graph.explain.*", "graph.datasets.*", "graph.door.*"]
    source: [" · S7 · S11c · S12-d", "", "", "", "", "WP-7 · ", " S1", " S2"]
    status: adopted

  - id: DS-6003
    name: Studio stage
    owner: apps/graph
    component: "apps/graph/src/components/graph/explorer/GraphExplorer2D.tsx#GraphExplorer2D; GraphCards.tsx#HoverCard · SearchHits; KnowledgeMap.tsx#KnowledgeMap"
    stories: apps-nexgraph-parts-studio-stage
    statement: >-
      The Studio's stage **as it is today** — the level-0 force-directed graph on a 2D canvas (a disc per type, a fixed
      type colour, hulls named by the colour cluster, the legend that filters, the status line that counts
      ), the `HoverCard` in the same frame (name · type · relations on stage; `role=presentation`, never focusable)
      `SearchHits` under the box (the server's hits with type and mentions, 150 ms debounce; no hits is a sentence) and
      the `KnowledgeMap` outline (the three lanes — lexical · subject · domain — as a list twin of the stage). The
      canvas itself is not a story (jsdom draws nothing); the DOM around it is — UAT-3 compares the running stage to
      these. **This row is the baseline the Graph Studio slice amends** (·: an analysis surface on
      graph-review practice — overview → zoom/filter → details on demand, named analyst views with the numbers beside
      the picture — and the *promote to corporate knowledge* door); nothing here is final. Built on `Field`,
      `IconButton`, `Menu`, `States`; the palette is the owner-approved G set in `graph.css`, read by the Studio
      slice into `tokens.css` as a data palette or kept app-local by the owner's word.
    states: [explorer-2d, knowledge-map, search-hits, hover-card]
    a11y: "the stage is a focusable `role=application` region with arrow-key walking, Enter selects, Shift+Enter opens, Esc backs out; the hover card is presentational (the Inspector is the accessible twin); search hits are a labelled list, their states `role=status`; the outline is an SVG `group` of `role=button` rows with `aria-pressed` and `aria-expanded`"
    copy: ["graph.studio.*", "graph.stage.*", "graph.search.*", "graph.map.*"]
    source: [" 08-UX", "UX-R8", " G", "", "", "", ""]
    status: adopted

  - id: DS-6004
    name: Bench run reader
    owner: apps/graph
    component: "apps/graph/src/components/graph/Bench.tsx#BenchRunChips · BenchStats · BenchMetrics · SectionTable · ItemsTable; screens/BenchScreen.tsx#BenchScreen; screens/BenchRunScreen.tsx#BenchRunScreen"
    stories: apps-nexgraph-bench · apps-nexgraph-benchrun · apps-nexgraph-parts-bench
