# · Design System Register · band 6 — App-local components (DS-6xxx): components one application owns because
# no other needs them (NexBI's chart blocks, NexGraph's evidence rail, NexMap's layers, NexCare's queue, NexForge's
# canvas, VibeBan's board). A row here is the proof the component is *not* a kit duplicate. Rows land at
# S2–S3 app by app.
band: 6
title: App-local components
lead: "What one application owns on purpose. Rows arrive at S2–S3, one application at a time."
rows: # ---------------------------------------------------------------- NexSales - id: DS-6101 name: Source chip owner: apps/sales component: "apps/sales/src/components/parts/SourceChip.tsx#SourceChip" stories: apps-nexsales-source-chip statement: >- Where a record lives and how fresh the copy is, next to its title: `NEXUS` for a native record; *from ‹provider› · ‹age›* for an external one read moments ago; *stale · ‹age›* when the last read is old; *‹provider› unavailable* when the source does not answer. Built on `Chip` (DS-3003) with the four semantic tones; glyph + text, never colour alone; the tooltip carries the exact verification time. Not a kit duplicate: the kit's Chip has no notion of provenance or age. states: [native, live, stale, unavailable] a11y: "the chip text is the status; the time is a `title` on a focusable span" copy: ["sales.source.nexus", "sales.source.from", "sales.source.stale", "sales.source.unavailable", "sales.source.verifiedAt"] source: [" 08-UX §", "ADR-0066"] status: adopted - id: DS-6102 name: Save ladder owner: apps/sales component: "apps/sales/src/components/parts/SaveLadder.tsx#SaveLadder" stories: apps-nexsales-save-ladder statement: >- The honest state of one write, in the log composer's footer (DS-6107; a FormInspector's footer elsewhere — amended 2026-10-11): draft · saving · waiting for ‹provider› · pending approval (names the approver) · saved (said only when the source confirmed and returned an id) · rejected (names the field) · conflict (mine · theirs; *Keep mine* · *Take theirs* · *Merge*) · reconciling · not saved (*Try again*) · ‹provider› unavailable · denied (read-only record type). A dot + sentence; `role="status"`, polite for the quiet states, assertive for the ones that need a hand. Not a kit duplicate: `EditBar` (DS-3033) has editing/saving only; the ladder is the write-through contract of a system of record. states: [draft, saving, pending_external, pending_approval, saved, rejected, conflict, reconciling, not_saved, unavailable, denied] a11y: "`role=status` · `aria-live` polite/assertive by state; the three conflict actions are real buttons" copy: ["sales.ladder.*"] source: [" 08-UX §", "…", "ADR-0066"] status: adopted - id: DS-6103 name: Sales Today (Overview page) owner: apps/sales component: "apps/sales/src/components/screens/TodayScreen.tsx#TodayScreen" stories: apps-nexsales-today statement: >- Today is an instance of the **Overview page** (DS-7006, the NexCore cockpit — amended 2026-10-11 twice: the owner found three columns overloaded, then asked for the NexCore Overview idiom): a `wide` frame with the health line in the header (`StatusDot` + small age, as NexCore's *operational*); the **Sales pulse** frame (`PulseStrip` — Accounts ─ Opportunities ─ Quotes waiting ─ Follow-ups, each a door; `live` when the provider is connected; the foot line: planned · waiting · overdue · going quiet); three `Stat`s (planned today · open pipeline as money · going quiet, with overdue as the toned delta); then two `nexus-cc-two` rows of `Section`s — *Planned today* (`StatusList`: account · kind · contact · time, row → account with the Log composer open) · *Waiting on me* (the attention list: title · account · assignee · due, dot red when overdue, the task reference as the door to NexTasks) · *Going quiet* (`StatusList`: account · relationship · owner · *n d quiet*, amber ≥30 d, red ≥60 d) · *Recent* (the recent list: who · kind · account · outcome · ago). Only kit classes; no app-local stylesheet. The org-admin sees the pulse figures and the quiet empty state, never the lists. states: [populated-connected, populated-native, empty-setup-door, org-admin-d423, loading, error, denied, offline] source: [" 08-UX §J1", "", "", "DS-7006"] status: adopted - id: DS-6104 name: Activity timeline owner: apps/sales component: "apps/sales/src/components/screens/AccountScreen.tsx#AccountScreen" stories: apps-nexsales-account-page statement: >- The account's activity stream (amended 2026-10-11): the log composer (DS-6107) at the top, then **Next** — planned interactions and open follow-ups in one list, soonest first — and **History**, done interactions newest first. One row grammar for both: a glyph (open = planned or follow-up, filled = done) · when · kind or title · outcome chip · who · with whom · the summary · the next step with its follow-up door. The stream is the *Activity* view of the page; Deals · Quotes · Documents are its sibling views (`LocalTabs`, DS-2006). The source chip (DS-6101) on the page line says where these came from; when the source is unavailable the list stays, marked as the last copy. Not a kit duplicate: no kit export shows a dated sequence with a planned/done glyph. **Deals** (amended 2026-10-13, S2-B · ADR-0066 A2) lists the account's deals · requests · leads · tasks as work rows (DS-6109) read as the person off every board they hold, with the shut-door line first — never a sales table; *Quote this* on an open request opens DS-7002 *New quote* prefilled. states: [connected, native, stale, source-unavailable, empty, deals, deals-empty, deals-tasks-away, deals-no-board, deals-board-hidden, quote-from-request, quotes, documents] source: [" 08-UX §J2", "", "", "ADR-0066 A2", ""] status: adopted - id: DS-6105 name: Pipeline boards owner: apps/sales component: "apps/sales/src/components/screens/PipelineScreen.tsx#PipelineScreen" stories: apps-nexsales-pipeline statement: >- **The board is VibeBan's** (amended 2026-10-12 — ADR-0066 A1 · (3); the owner: *"the pipeline must be a VibeBan capability, not a duplicate in the sales system"*): an opportunity is a VibeBan item of the pack's type on a *Pipeline* board (`nexus://tasks/project_template/sales-pipeline`), and the board — stages, cards, drag, limits, the sum — is NexTasks' own screen (DS-6201 card facts · rollups). NexSales draws no board: the screen is the projection sales-api composes as the person (`GET /sales/pipeline`) — one `DataTable` row per board (*board ↗ · key · open deals · pipeline sum*, `mixed` when the currencies disagree, *not yours to read* when the person may list but not read it), the row a door into NexTasks' Board tab. No board → `EmptyState` with the one door *New board in NexTasks*; NexTasks away → said as such. **Leads** and **Requests** (amended 2026-10-13, S2-B · ADR-0066 A2) are two more views of the same screen (`LocalTabs`, DS-2006): the open leads off the person's *Leads* boards (`nexus://tasks/project_template/leads`) and the open requests off their Pipeline boards, each a `DataTable` of work rows (DS-6109 words: key · title ↗ · the type's facts · stage · the quote a request became) and a door into the item; no Leads board → the one door *New Leads board in NexTasks* (quiet — the page's one primary is the Pipeline's). A lead converts into a deal in VibeBan (ADR-0043 A5), never here. The 2026-10-11 app-local board (columns · rails · drag · Shift+arrows · `⋯ Move to…`) is retired; its measures live in VibeBan's `.nexus-tasks-board`. states: [boards-connected, boards-native, boards-two, board-hidden, no-board, no-board-cannot-act, tasks-away, leads, leads-no-board, leads-tasks-away, requests, requests-empty, empty, loading, error, denied, offline] a11y: "a table with a caption; the board link says *opens in NexTasks* to a reader; the empty state's one action is a real link; the unavailable line is plain text, not an error" source: [" 08-UX §J5", "", "ADR-0066 A1", "ADR-0067 A1", ""] status: adopted - id: DS-6106 name: Setup door owner: apps/sales component: "apps/sales/src/components/screens/SetupDoor.tsx#SetupDoor" stories: apps-nexsales-setup-door statement: >- The first screen of an empty organization: one question — start in NEXUS, or connect the system that already holds the customers — as two radio cards and one primary button. One door in; no wizard, no tour. Built on `EmptyState` (DS-3011) `variant="card"` with a `starting` list would hide the choice; the radio pair is the choice. states: [native-chosen, connect-chosen] a11y: "a `fieldset` with a legend; native radios; the button label changes with the choice" source: [" 08-UX §J9b", ""] status: adopted - id: DS-6107 name: Log composer owner: apps/sales component: "apps/sales/src/components/parts/LogInteractionForm.tsx#LogInteractionForm" stories: apps-nexsales-log-composer statement: >- The interaction is written **in the activity stream**, not in a side panel (proposed 2026-10-11, replacing the S0 FormInspector — the owner found the page overloaded with the panel open). Closed, it is one quiet line at the top of *Activity* — `+ Log a call, a meeting or a note…`. Open, it is one bordered block: a head (title · `×`), one row of four compact fields — kind · contact · when · outcome (`Field` + `Select compact`) — the summary (the only required field; its hint is the placeholder), an optional *Plan the next step* switch that reveals *next step · due*, and a footer where the save ladder (DS-6102) sits at the left and *Cancel · Save* (`Button size="toolbar"`) at the right. The header's *Log interaction* opens the same composer. With AI off the last line says so (08). Esc closes while nothing is in flight; the composer closes itself once the source confirmed the write. Built on `Field` · `Select` · `Switch` · `Button` · `IconButton` · `Hint`. Not a kit duplicate: `FormInspector` (DS-3032) is a panel; `EditBar` (DS-3033) has no fields. states: [closed-line, draft, saving, pending_external, saved, pending_approval, rejected, conflict, not_saved, unavailable, denied] a11y: "a `form` labelled by its title; the summary takes focus on open; the required field is announced on submit; Esc returns focus to the opener; the ladder is the `role=status` of the write" copy: ["sales.log.start", "sales.log.title", "sales.log.aiOff", "sales.form.*", "sales.ladder.*"] source: [" 08-UX §J3", "…", "", ""] status: proposed # DS-6108 *Composer-line door* (proposed 2026-10-12, (1)) was withdrawn the same day at the owner's walk-through #. Every NexSales record door is DS-7002 *Create in the Inspector* — the form # first, the first field focused, the look-alike check on blur — rendered in `Apps/NexSales/Record doors`. # The id is not reused. - id: DS-6109 name: Work rows owner: apps/sales component: "apps/sales/src/components/parts/WorkRows.tsx#WorkRows" stories: apps-nexsales-work-rows statement: >- **Deals, leads and requests are VibeBan's**: one row grammar for every VibeBan item NexSales lists on the account page (*Deals* view) and the Pipeline screen (*Leads* · *Requests* views) — *key · title · the kind's facts · stage · amount · the door*. The rows are read as the person (`tasks.items.list` through sales-api); the title, the stage's name and every field are tasks-api's words, and what the person may not read is simply not there. A deal shows its `amount` and close date; a lead its company and channel, and *became a deal* with the deal's door once converted (`fields.converted_to`, the declared conversion of ADR-0043 A5 — done in VibeBan, never here); a request what it wants by when and, once a quote answers it, the quote's title as a link (`fields.quote_ref`, written by sales-api as the person) — or *Quote this* while none does and the person may quote (the one door into DS-7002 *New quote*, prefilled; the quote carries `request_ref`). `WorkDoorState` is the honest line above the lists when the door is shut: NexTasks away · no board yet · a board the person may list but not read (named, `role=status`, not an error). Built on `EmptyState` · `StatusDot` · `Chip` · `Button`; the list is the `.nexus-sales-rows` grammar of DS-6104. Not a kit duplicate: no kit export lists typed items of a sibling app with their doors and a per-kind action. Never a NexSales record — no table, no cache, no stage of its own. states: [deals, requests, requests-read-only, leads, one-account, empty, tasks-away, no-board, board-hidden] a11y: "a list; every row's door is a real link naming the key to a reader; *Quote this* is a button; the shut-door line is `role=status`; the stage's tone is redundant to its name (DS-0001)" copy: ["sales.work.*", "sales.section.leads", "sales.section.tasks", "sales.leads.emptyBody", "sales.leads.newBoard", "sales.requests.emptyBody", "sales.quotes.forRequest"] source: [" 08-UX §J2 · §J5", "", "", "ADR-0066 A2", "ADR-0043 A5", "", ""] status: proposed # ---------------------------------------------------------------- S3-B WP-2…WP-6 (proposed 2026-10-11): the five # applications brought to the register — VibeBan · NexBI · NexMap · NexCare · NexCore. Each row names what the app owns # on purpose and is the proof the part is not a kit duplicate. Pending the owner's approval. - id: DS-6201 name: Work-item glyphs and property fields owner: apps/tasks component: "apps/tasks/src/components/tasks/common.tsx#PriorityChip · StageDot · TypeGlyph · BlockedGlyph · HealthDot · ActorChip · DueLabel · ItemRow; DateField · EstimateField · EnterField · Description · ShowMore; FieldRows.tsx#FieldRows · FieldInputs · CardFacts · RollupLine; FieldSpecEditor.tsx#FieldSpecList · FieldSpecEditor" stories: apps-nextasks-parts statement: >- The atoms every VibeBan list, board card and Inspector row is built from. Priority (`‼ ! · ◦` + the word), stage (`○ ◔ ◑ ◕ ● ⊘`), type (epic · story · task · bug glyphs), blocked (`n` + direction), health (`StatusDot` with the word) — glyph + text, never colour alone. `ActorChip` is a human, an agent or a service with its kind; `DueLabel` says overdue · today · the date. The property fields are the Inspector's editors — bare at rest, framed on hover/focus (`quiet`), Enter commits, Esc reverts; `EstimateField` carries the project's unit. `ShowMore` is the page foot (*n of total · Show more*). **Typed item fields**: a type's `fields[]` (text · number · money · date · choice · yes/no · reference) are Inspector rows under the built-in ones in the same quiet idiom (`FieldRows` — money is a number and a 3-letter currency; a reference shows its prefix and takes the id; a `financial` row is absent for a viewer, *Not set* for an editor); the create form shows them as `Field`s (`FieldInputs`, required marked, a problem named at its row); a board card carries up to three `show_on_card` values as a label-less facts strip (`CardFacts`, the label is the title — DS-6105's *account · amount · closes*); a column head says each `rollup: sum` once after the count pill (`RollupLine`; *mixed* when the currencies disagree). Settings › Types edits a type's fields (`FieldSpecEditor`: label en · uk, kind, key locked once saved, required / at a stage category, on the card, sum, sensitivity, a choice's options one per line, a reference's prefix; ≤ 16) and reads them as one quiet line each (`FieldSpecList`). Built on `Chip` (DS-3003), `StatusDot` (DS-3004), `Field` (DS-3020), `Select`, `Switch`, `PropertyRow` and `Menu` (DS-3005); not a kit duplicate — the kit has no notion of a work item's priority, stage, type, estimate or typed field. states: [glyphs, rows, fields, more, typed-fields, field-specs] a11y: "every glyph is `role=img` with an `aria-label` and a `title`; the fields are labelled inputs; a fact carries `aria-label` *label: value*; an unparsable value is `aria-invalid` with a `role=alert` line" copy: ["tasks.priority.*", "tasks.stage.*", "tasks.type.*", "tasks.health.*", "tasks.due.*", "tasks.palette.*", "tasks.fields.*"] source: [" 08-UX", "", "", "ADR-0043 A4", " S1-A4"] status: adopted - id: DS-6301 name: Dashboard blocks owner: apps/bi component: "apps/bi/src/components/bi/Block.tsx#BlockCard · Grid.tsx#Grid · common.tsx#BlockChart · SeriesTable · MetricStatusDot · CertifiedChip · LinkRow · OpenInGraphLink" stories: apps-nexbi-parts statement: >- What NexBI owns: the block card (title · figure or chart · the *Data* twin · the trace door; `studio` adds the selection ring and the handles), the 12-column grid it sits on (drag · resize · keyboard, ~150 lines — no library, UX_PROPOSAL; a live region announces every move), the chart through `@nexus/ui`'s ECharts adapter and its accessible table twin (`SeriesTable`, the *Data* tab). `MetricStatusDot` (draft · proposed · certified · deprecated) and `CertifiedChip` are `StatusDot`/`Chip` with the metric vocabulary; `LinkRow` is the discovery row (DS-7001) with a meta column; `OpenInGraphLink` is the door to NexGraph. Not a kit duplicate: the kit has no grid, no block and no chart card. states: [chips, chart, block, grid-editable] a11y: "the chart is `role=img` with the title as its name and the table as its twin; grid items are focusable with arrow-key move and resize announced" copy: ["bi.metric.status.*", "bi.dataset.certified", "bi.dataset.uncertified", "bi.block.*", "bi.grid.*"] source: [" 08-UX", "UX_PROPOSAL", "", ""] status: adopted - id: DS-6401 name: Workspace furniture owner: apps/map component: "apps/map/src/components/workspace/labels.tsx#KindGlyph · StatusLine · MapControls · LayersPanel · ShortcutsSheet · Tooltip" stories: apps-nexmap-parts statement: >- Everything that floats over NexMap's WebGL canvas and is DOM, not map: the kind glyphs (shipment · vessel · aircraft · hub by kind), the status line (cursor · zoom band · what is on screen · loading), the map controls (layers · zoom · reset north — `IconButton`s in a dock), the layers panel (a floating surface, DS-7015, with one switch per layer and the unplaced count as a door), the keyboard sheet (`?`) and the hover tooltip (feature · cell · zone · event · lane — one grammar, `role=presentation`, never focusable). Layers and dock tokens: `--nexus-z-dock` · `--nexus-z-popover`; the canvas itself is not a story (WebGL) — UAT-3 compares the running workspace to these. Not a kit duplicate: the kit has no map, no layers and no hover card. states: [glyphs, controls, layers, shortcuts, hover] a11y: "controls are labelled buttons with `aria-keyshortcuts`; the layers panel is a dialog that returns focus; the status line is `role=status`" copy: ["map.kind.*", "map.status.*", "map.controls.*", "map.layers.*", "map.shortcuts.*", "map.tooltip.*"] source: [" 08-UX–5", "", ""] status: adopted - id: DS-6501 name: Conversation parts owner: apps/care component: "apps/care/src/components/inbox/Timeline.tsx#Timeline · SummaryCard · Composer.tsx#Composer · ConversationInspector.tsx#ConversationInspector" stories: apps-nexcare-parts statement: >- NexCare's conversation: the timeline (customer · agent · assistant · tool · system entries, each labelled by who said it and whether the customer saw it — internal entries are visibly internal), the handoff summary card (what the assistant checked as a tick list, its reason codes, the sentiment labelled *model-inferred* — rule 85, a feature never a verdict), the composer (reply vs internal note as one segmented choice; the assistant's draft carries its provenance into the send) and the conversation Inspector (identity · facts · case · journey; one primary — *Create case*). Not a kit duplicate: `TurnCard` (DS-5xxx) is NexChat's own turn; a care timeline has two parties and a tool lane. states: [thread, summary, reply, read-only, inspector] a11y: "the timeline is a `list` of labelled entries; the composer is a `form` with the mode as a radiogroup; the inspector is `complementary` and returns focus on close" copy: ["care.timeline.*", "care.summary.*", "care.composer.*", "care.inspector.*"] source: [" 08-UX–6", "rule 85"] status: adopted - id: DS-6601 name: Governance parts owner: apps/core component: "apps/core/src/components/screens/ProjectsScreen.tsx#ClassificationChip · TraceInspector.tsx#RecordStatus · SpanTree · SpanDetail" stories: apps-nexcore-parts statement: >- The classification chip (public · confidential · dsk · secret · top_secret — tone + the word), the record status dot (a trace record's lifecycle word), and the trace Inspector's two halves: the span tree (turn → run → call, a time bar per span, container spans fold) and the span detail (the record as fields — refs · statuses · timings · counts · digests, never content; payloads fetched only when opened, redactions named, classification shown; `denied` and `capture off` are honest rungs). Built on `Chip` · `StatusDot` · `Inspector` (DS-3030). Not a kit duplicate: the kit has no span tree. states: [chips, trace, trace-payloads, trace-denied, trace-capture-off] a11y: "the span tree is a `tree` with `aria-level` and arrow keys; the detail is labelled by the span; payload previews are `pre` with the classification announced first" copy: ["core.classification.*", "core.trace.*"] source: [" 08-UX", " FR-OBS-004", ""] status: adopted - id: DS-6602 name: Auth doors owner: apps/core component: "apps/core/src/components/auth/AuthScreens.tsx#SignUpScreen · SignInScreen · VerifyScreen · WelcomeScreen · CreateOrganizationScreen" stories: apps-nexcore-auth statement: >- The five doors into NEXUS: sign up · sign in · verify · welcome · create an organization — one centred card in the bare shell (`BareShell`: no launcher, no dock), one primary action per card, the platform's offers (Google · the dev inbox) only when it says so; the reason a door is closed is one sentence from the server's reason code. Built on `Field` · `Button` · `LinkButton` · `Restriction`; `.nexus-cc-bare` is the only app-local measure. Not a kit duplicate: the kit has no auth card. states: [sign-up, sign-in, verify, welcome, create-organization] a11y: "a `main` with one `h1`; the form's first field takes focus; errors are `role=alert` next to the field" copy: ["core.auth.*"] source: [" 08-UX", ""] status: adopted