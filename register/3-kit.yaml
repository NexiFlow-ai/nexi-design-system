# · Design System Register · band 3 — Kit components (DS-3xxx): every export of `@nexus/ui/workbench` and the
# shared `@nexus/ui` root. `component` is the import path and export; `stories` the Storybook title id whose stories
# prove the row; `states` what the stories must show.
# `status: legacy` rows stay until their deletion is decided and are never a new screen's choice.
band: 3
title: Kit components
lead: >- The workbench kit: forty-six exports every suite app composes instead of writing its own. Each row is one component, its contract and the states its stories show.
rows: # ---------------------------------------------------------------- atoms - id: DS-3001 name: Button component: "@nexus/ui/workbench#Button" stories: kit-button statement: >- The one button. `default` · `primary` (the single most important action on a surface) · `ghost` · `danger` (filled — a confirmation's destructive primary only) · `destructive` (outlined — opens such a confirmation); 36 px on the header line; 32 px with `size="toolbar"` on a toolbar line and in the Inspector footer; 28 px with `size="sm"` for row-level actions; the icon button 28 (32 in the rail). No other size. ≤ 2 visible buttons per header or footer; a toggle is `aria-pressed`. states: [default, primary, ghost, danger, destructive, sm, toolbar, disabled, with-icon] a11y: "a real `<button>`; `type` defaults to `button`; the label is text, an icon is `aria-hidden`" source: [" ",, "",, ] status: adopted proof: kit-button--default - id: DS-3002 name: IconButton component: "@nexus/ui/workbench#IconButton" stories: kit-button statement: "Icon-only button: `label` is mandatory and becomes both `aria-label` and the tooltip. 32 px in the rail, 28 px in a row." states: [default, disabled] a11y: "accessible name from `label`; never an unlabeled icon" source: [" "] status: adopted proof: kit-button--icon-only - id: DS-3003 name: Chip component: "@nexus/ui/workbench#Chip" stories: kit-chip statement: "A short qualifier next to a title — classification, kind, a count. Five semantic tones; never a product colour, never clickable." states: [neutral, ok, warn, danger, muted, xs, removable] source: [" ", ] status: adopted proof: kit-chip--default - id: DS-3004 name: StatusDot component: "@nexus/ui/workbench#StatusDot" stories: kit-chip statement: "Status = a semantic dot *and* a visible label; the colour is redundant, the text carries the meaning." states: [ok, warn, danger, neutral, muted, sm] a11y: "the dot is `aria-hidden`; the label is the status" source: [""] status: adopted proof: kit-chip--status - id: DS-3005 name: Menu component: "@nexus/ui/workbench#Menu" stories: kit-menu statement: "The `⋯` for secondary actions. Items may be `danger` (opens a destructive confirmation) or `disabled`; Esc and an outside click close it." states: [closed, open, danger-item, disabled-item] a11y: "`aria-haspopup=menu` · `aria-expanded` · `role=menu` / `menuitem`" source: ["R2"] status: adopted proof: kit-menu--closed - id: DS-3006 name: SavedNote component: "@nexus/ui/workbench#SavedNote" stories: kit-menu statement: "The transient *Saved* line after a commit — `role=status`, gone after 3 s (`useSavedNote`)." states: [hidden, shown] source: [""] status: adopted proof: kit-menu--saved - id: DS-3007 name: Avatar component: "@nexus/ui/workbench#Avatar" stories: kit-menu statement: "Initials on graphite, decorative (`aria-hidden`); the name sits next to it as text. Sizes 20 · 28 · 36 · 48." states: [sizes] source: ["R2"] status: adopted proof: kit-menu--initials - id: DS-3008 name: Hint component: "@nexus/ui/workbench#Hint" stories: kit-menu statement: "The one-line *who may do this* under a row of actions." states: [default] status: adopted proof: kit-menu--hint-and-restriction - id: DS-3009 name: Restriction component: "@nexus/ui/workbench#Restriction" stories: kit-menu statement: "Text that explains a restriction (`Restricted by <policy>`) — never a bare disabled control (DS-0004)." states: [by, custom, absent] source: ["", ] status: adopted proof: kit-menu--hint-and-restriction # ---------------------------------------------------------------- forms - id: DS-3010 name: Field component: "@nexus/ui/workbench#Field" stories: kit-forms statement: "Label above, hint under, error under the hint with `role=alert`; the render prop hands the control `id`, `aria-describedby`, `aria-invalid`. The form's first error receives focus on submit." states: [plain, hint, error, required, textarea] source: [""] status: adopted proof: kit-forms--field-states - id: DS-3011 name: Select component: "@nexus/ui/workbench#Select" stories: kit-forms statement: "The combobox as the suite's only select — never a native `<select>`. `compact` for a toolbar filter; `quiet` for a property value." states: [field, compact, quiet, disabled-option, description, section] a11y: "labelled by the Field's label or a visually hidden one; the trigger is `role=combobox`" source: ["", ""] status: adopted proof: kit-forms--select-field - id: DS-3064 name: DatePicker component: "@nexus/ui/workbench#DatePicker" stories: kit-datepicker statement: "The suite's calendar instead of the browser's `<input type=\"date\">` popup (which cannot take the kit's colours, only its light/dark scheme): the Select trigger (DS-3011) with a calendar glyph, a month grid on the picker surface, the selected day as the primary pair (ink on paper), today a ring, other months muted, `Clear` · `Today` as links; `withTime` adds an hour and a minute Select. Values are the native wire shapes (`YYYY-MM-DD` · `YYYY-MM-DDTHH:mm`, local time)." states: [empty, picked, with-time, compact, bounded, disabled] a11y: "trigger `aria-haspopup=dialog` with the Field's label or a visually hidden one; the popover is `role=dialog`; the month is `role=grid` with a roving tabindex — arrows move a day or a week, PageUp/PageDown a month, Home/End the week's ends, Enter picks, Escape closes and returns focus" source: ["owner 2026-10-11 22:56 (the native picker in browser blue)", "DS-3011"] status: adopted proof: kit-datepicker--states - id: DS-3012 name: Switch component: "@nexus/ui/workbench#Switch" stories: kit-forms statement: "Enable / disable — the change is the commit; the caller shows the saved note." states: [on, off, disabled] a11y: "`role=switch` · `aria-checked`" status: adopted proof: kit-forms--switches - id: DS-3013 name: CheckList component: "@nexus/ui/workbench#CheckList" stories: kit-forms statement: "Checkbox list for memberships (groups, projects); an optional hint per row." states: [default] a11y: "a `fieldset` with a visually hidden legend" status: adopted proof: kit-forms--memberships - id: DS-3014 name: SearchField component: "@nexus/ui/workbench#SearchField" stories: kit-forms statement: "`type=search` with a visually hidden label; shown only when `showListControls` says the list needs it." states: [default] source: [] status: adopted proof: kit-forms--toolbar-row - id: DS-3015 name: SecretInput component: "@nexus/ui/workbench#SecretInput" stories: kit-forms statement: "A secret typed once: masked by default, an eye toggle reveals what was typed until Save clears it; a stored secret never comes back to the browser — the form says *stored*." states: [masked, shown, empty, disabled] a11y: "the toggle is `aria-pressed` with a localized label" source: [,, "owner 2026-10-01"] status: adopted proof: kit-forms--secret - id: DS-3016 name: EditBar component: "@nexus/ui/workbench#EditBar" stories: kit-editbar statement: "Edit → form → Save / Cancel. A dirty Cancel asks inline through `useDiscardGuard` (Discard · Keep editing) — never `window.confirm`; `saved` shows the note; `canEdit=false` hides Edit." states: [read, read-cannot-edit, editing, error, dirty-cancel] source: ["",, ] status: adopted proof: kit-editbar--read - id: DS-3017 name: PropertyList · PropertyRow component: "@nexus/ui/workbench#PropertyList" stories: kit-properties statement: "An Inspector shows a resource's *properties*: one quiet row per property, label left, value right; the value *is* the control (a quiet Select, a date button, an actor chip). No bordered field boxes, no helper sentences." states: [end-aligned, start-aligned, hint] source: [""] status: adopted proof: kit-properties--properties - id: DS-3018 name: Facts · Fact component: "@nexus/ui/workbench#Facts" stories: kit-properties statement: "Read-only label · value pairs on a detail page (one or two columns); `Fact` is the Inspector's row." states: [one-column, two-columns, inspector-row] status: adopted proof: kit-properties--read-only - id: DS-3019 name: Toolbar · showListControls component: "@nexus/ui/workbench#Toolbar" stories: kit-forms statement: "The row of search · filters · primary action above a list — rendered only when `showListControls(total, active)` is true: more than 12 rows, or a control in use." states: [shown, hidden-under-threshold] source: [] status: adopted proof: kit-forms--toolbar-row # ---------------------------------------------------------------- page - id: DS-3020 name: PageFrame component: "@nexus/ui/workbench#PageFrame" stories: kit-pageframe statement: "The content column. `layout=\"dense\"` renders the one header line (DS-2005); `stacked` (eyebrow · title · lead · meta) is NexCore's and NexChat's and legacy elsewhere. `width` standard or wide." states: [dense, dense-wide, dense-long-title, stacked-legacy] a11y: "one `h1` per page; the back link is labelled" source: [, ""] status: adopted proof: kit-pageframe--dense - id: DS-3021 name: PageLine component: "@nexus/ui/workbench#PageLine" stories: kit-pageframe statement: "The header line on its own, for an app that keeps its own page layout." states: [default] source: [, ] status: adopted proof: kit-pageframe--line - id: DS-3022 name: Section component: "@nexus/ui/workbench#Section" stories: kit-pageframe statement: "An uppercase section title with an optional trailing link (*View all →*) or aside — the building block of overviews." states: [with-link, with-aside] a11y: "`<section aria-labelledby>` with an `h2`" status: adopted proof: kit-pageframe--sections - id: DS-3023 name: UrlTabs · LocalTabs component: "@nexus/ui/workbench#UrlTabs" stories: kit-navigation statement: "One underline tab row — 36 px, 600 weight when active, a 2 px accent line, no fill, optional counts. `UrlTabs` keeps state in `?tab=`; `LocalTabs` in the parent (`layout=\"page\"` or the compact `inline` for an Inspector). `variant=\"surface\"` is the legacy pill." states: [page, inline, url, surface-legacy] a11y: "WAI-ARIA tabs with roving tabindex; `id` wires `aria-controls` to panels" source: [,, ] status: adopted proof: kit-navigation--tabs - id: DS-3024 name: SideNav · SideNavLayout component: "@nexus/ui/workbench#SideNav" stories: kit-navigation statement: "The second navigation level: a 200 px left column of sections with counts, `aria-current=\"page\"`, ↑ ↓ Home End; state in the URL (`href`) or the parent (`onSelect`). Collapses above the content under 720 px." states: [buttons, links, disabled-item] source: [] status: adopted proof: kit-navigation--left-nav # ---------------------------------------------------------------- surfaces - id: DS-3030 name: DataTable component: "@nexus/ui/workbench#DataTable" stories: kit-datatable statement: "Every list of records: a real `<table>`, 36 px sticky header, 42 px rows, one border; click / Space selects (`aria-selected`), Enter / double-click drills in. The body owns `loading`, `error` (with Retry) and `empty` — a header over nothing is a defect." states: [populated, selectable, empty, loading, error, wrapping, bare-header-forbidden] a11y: "a visually hidden `caption`; rows that open something are focusable" source: ["", " AC-3", ] status: adopted proof: kit-datatable--populated - id: DS-3035 name: RowList component: "@nexus/ui/workbench#RowList · #Row (new, S1)" stories: kit-rowlist statement: >- A list of things that are not a grid — conversations, layers, threads, inbox items: 36 px rows (44 with a second meta line), 12 px inset, a 2 px accent rail for the selected row, hover `bg-subtle`, the whole row a target. Replaces `.nexus-tasks-row`, `.nexus-care-row`, `.nexus-care-chat-row`, `.nexus-map-layer-row` (UX-AUDIT,) — four app rows that are one thing with four sets of numbers. states: [populated, selected, with-meta, empty, loading, error] a11y: "a real list (`ul`/`li`) or `role=\"listbox\"` when single-select; rows are focusable, arrow keys move" source: ["UX-AUDIT",, "STYLE-CENSUS", ] status: adopted proof: kit-rowlist--populated - id: DS-3036 name: RadioCard component: "@nexus/ui/workbench#RadioCard (new, S1)" stories: kit-forms statement: >- A bordered choice with a title and a one-line description, 16 px radio in the first column, 10 px gap; the card is the label. Promoted from VibeBan's `.nexus-tasks-radio` (UX-AUDIT); the only way to offer two to five explained options — never a `Select` for that. states: [default, checked, disabled, with-description] a11y: "a native `input[type=radio]` inside a `label`; the group has a `fieldset`/`legend`" source: ["UX-AUDIT",, " VibeBan", ] status: adopted proof: kit-forms--radio-cards - id: DS-3037 name: SaveViewPanel component: "@nexus/ui/workbench#SaveViewPanel (new, S1)" stories: kit-forms statement: >- *Save this view* as an `ActionPanel`: name, optional description, *Save* · *Cancel*, a *Replace existing* switch when a view of that name exists. One component for NexGraph and NexMap (both define their own today, UX-AUDIT); NexBI's dashboards join at S3. states: [new, replace-existing, saving, error] a11y: "inherits ActionPanel (DS-3034); the name field has the initial focus" source: ["UX-AUDIT",, ] status: adopted proof: kit-forms--save-view - id: DS-3063 name: LinkButton · ActionRow component: "@nexus/ui/workbench#LinkButton · #ActionRow (ActionRow new, S3-B WP-0; `tone` · `href` on LinkButton)" stories: kit-links statement: >- A `<button>` or `<a>` that reads as a link — the inline look (DS-7012) over a 24 px target — in three tones: `inline` (text colour, underlined), `meta` (12 px secondary), `quiet` (13 px · 500 · secondary, underline on hover: the goal card's actions). `ActionRow` lays its children on one baseline with an `aria-hidden` `·` between, wraps, and is the only container for secondary actions under content (DS-7016). Replaces the seven app-local link-button classes and the ≈ 40 `*-actions` containers of the audit. states: [inline, meta, quiet, in-row, disabled, busy, with-door] a11y: "a real control; one tab stop per action; the separator is decorative; focus ring `--nexus-focus`; a disabled action is removed, not greyed (DS-0004)" source: ["CONSISTENCY-AUDIT A1–A3",, ] status: adopted proof: kit-links--quiet-action-row - id: DS-3031 name: Inspector component: "@nexus/ui/workbench#Inspector" stories: kit-inspector statement: "The right-hand detail panel: the head owns kind · title · one line of subtitle (13 px secondary, 4 under the title) / avatar · primary · `⋯` · close, 20 px inset, **16 above and below the head rule**; optional tabs; sections; body rows 4 apart; a sticky footer (rule · 12 · action · 12). 360–640 px by a keyboard separator (← → 16 px, Home / End, double-click resets), width persisted as `--inspector-width`; Esc closes and focus returns to the opener. Every vertical measure from DS-1011." states: [detail, with-tabs, live-open-close] a11y: "`<aside aria-label>`; focus lands on the title; the splitter is `role=separator` with values" source: ["",, ] status: adopted proof: kit-inspector--detail - id: DS-3032 name: InspectorSection component: "@nexus/ui/workbench#InspectorSection" stories: kit-inspector statement: "`idiom=\"rule\"` — a 1 px rule above, a 13 px sentence-case title, an optional one-line description and a trailing aside (count · link · small action), 16 px above and below, rows at 8 px. `caps` is the pre- uppercase `h4`, legacy. `collapsible` (owner 2026-10-11, the Tasks Inspector's *Details*): the title is the disclosure, a chevron at the far right turns when closed, `defaultOpen=false` starts it closed and the body stays in the DOM (`hidden`)." states: [rule, rule-with-description, rule-with-aside, rule-collapsible, caps-legacy] source: [, "owner ask 6"] status: adopted proof: kit-inspector--sections - id: DS-3033 name: FormInspector component: "@nexus/ui/workbench#FormInspector" stories: kit-inspector statement: "Creation in the Inspector: *New …* opens the panel empty, the form fills it (fields 16 apart, DS-7014); focus lands on the first control. The footer is **one** primary at the toolbar size (32), right-aligned, **enabled throughout** — validation on submit, `error` above the actions — with Cancel as a link-button; never two bordered 36 px twins, never a disabled primary as the only clue. A sentence under the head rule (`lead`) is retired: what must be said before the first field is the head's subtitle; detail Inspectors keep no footer — the value is the control (DS-3034) or `EditBar`." states: [new, error] source: [" R4",, ] status: adopted proof: kit-inspector--form - id: DS-3034 name: ActionPanel component: "@nexus/ui/workbench#ActionPanel" stories: kit-editbar statement: "The inline confirmation: appears where the action was taken, names the effect, one primary, Cancel; `onSubmit` makes it a form (Enter submits); `danger` for the destructive variant with a typed name. Esc cancels; focus moves to the heading." states: [reversible, destructive-typed, open] a11y: "`role=group aria-labelledby` the heading" source: [,, " R4"] status: adopted proof: kit-editbar--confirmation # ---------------------------------------------------------------- states - id: DS-3040 name: LoadingState component: "@nexus/ui/workbench#LoadingState" stories: kit-states statement: "Text only, `role=status aria-live=polite`; no spinner colour." states: [default] status: adopted proof: kit-states--loading - id: DS-3041 name: EmptyState component: "@nexus/ui/workbench#EmptyState" stories: kit-states statement: "`quiet` (default): one line of title, one primary action, ≤ 3 starting points as plain links, a `body` only when a permission or dependency explains the emptiness. `inline`: the one-line version for a table body, column or Inspector section. `card` (dashed, options chips) is legacy." states: [quiet, quiet-with-reason, inline, card-legacy] a11y: "the starting points list is labelled by the title" source: [,, ] status: adopted proof: kit-states--quiet - id: DS-3042 name: ErrorState component: "@nexus/ui/workbench#ErrorState" stories: kit-states statement: "`error` and `offline` carry Retry; `denied` names who may grant access when the screen knows; `notFound` doubles as the other-tenant answer." states: [error, denied, offline, notFound] a11y: "`role=alert`" source: [, ] status: adopted proof: kit-states--errors - id: DS-3043 name: DataStateView component: "@nexus/ui/workbench#DataStateView" stories: kit-states statement: "One switch for the ladder: loading · empty · error · denied · notFound · offline · ready. Every screen reads through it." states: [all-seven] source: [] status: adopted proof: kit-states--ladder # ---------------------------------------------------------------- visuals - id: DS-3050 name: Sparkline component: "@nexus/ui/workbench#Sparkline" stories: kit-visuals statement: "A thin monochrome line over a series, last point marked; decorative — the number sits next to it." states: [default] source: ["R2–"] status: adopted proof: kit-visuals--spark - id: DS-3051 name: Stat component: "@nexus/ui/workbench#Stat" stories: kit-visuals statement: "Big numeral · label · delta (toned) · hint · sparkline — the only chart for a metric on an overview." states: [delta-ok, delta-danger, plain] status: adopted proof: kit-visuals--stats - id: DS-3052 name: PulseStrip component: "@nexus/ui/workbench#PulseStrip" stories: kit-visuals statement: "The organization's runtime as one line — Projects ─ Capabilities ─ Models ─ Connections; filled dot healthy, hollow an issue; `live` runs a subtle pulse (reduced motion off)." states: [live, static] source: ["R2"] status: adopted proof: kit-visuals--pulse - id: DS-3053 name: Bands component: "@nexus/ui/workbench#Bands" stories: kit-visuals statement: "Shares as horizontal bar strips with a legend — never a pie." states: [default] status: adopted proof: kit-visuals--shares - id: DS-3054 name: SummaryColumns component: "@nexus/ui/workbench#SummaryColumns" stories: kit-visuals statement: "Three columns (ownership · governance · usage) of value · label rows on a detail page." states: [default] source: ["R2"] status: adopted proof: kit-visuals--summary - id: DS-3055 name: StatusList component: "@nexus/ui/workbench#StatusList" stories: kit-visuals statement: "Compact name · meta · status rows on an overview (Models, Connections); hover reveals `detail`; rows may link." states: [default] status: adopted proof: kit-visuals--list - id: DS-3056 name: JsonTree component: "@nexus/ui/workbench#JsonTree" stories: kit-jsontree statement: "A collapsible JSON view: keys muted, values typed by weight and a monospace face (never colour), containers with a count and a toggle; copy per node." states: [default, collapsed, expanded] a11y: "`role=tree`" source: [] status: adopted proof: kit-jsontree--default # ---------------------------------------------------------------- the ui root - id: DS-3060 name: Combobox component: "@nexus/ui#Combobox" stories: kit-combobox statement: "The picker on the composer's surface: field-like trigger, list opening downward, sections, descriptions, disabled options that say why, type-ahead, Esc / Enter / arrows. `Select` wraps it; the composer pickers use it directly." states: [default, placeholder, disabled] a11y: "`role=combobox` + `listbox`; named by `labelledBy` or a `<label for>`" source: ["NexChat composer pickers"] status: adopted proof: kit-combobox--default - id: DS-3061 name: NexusButton · NexusIconButton component: "@nexus/ui#NexusButton" stories: legacy-nexusbutton statement: "The pre- button exports of `@nexus/ui`. No app imported them; `Button` / `IconButton` are the contract. **Deleted at S1-B** ((a),) — the row stays so the id is never reused." states: [variants] source: ["", ] status: legacy proof: deleted-s1b - id: DS-3062 name: ComponentCatalogue component: "@nexus/ui/workbench#ComponentCatalogue" stories: none statement: "The `/uat/components` review harness of — replaced by the workshop; the routes are retired at S3 once the a11y and fitness specs point at the static Storybook." states: [] source: [" ", ] status: legacy proof: legacy-componentcatalogue--harness