# · Design System Register · band 2 — Layout & Shell (DS-2xxx). How a page is put together and what every
# application mounts from `@nexus/app-shell`. The shell's own stories (NexusShell · ShellDock · AppLauncher ·
# SettingsSheet · OfflineStrip · CommandPalette) land at S1 (band 4 rows point here); S0 proves the page-level rows
# through the kit.
band: 2
title: Layout & Shell
lead: >- One shell, one page frame, one way to go two levels deep, one right-hand panel. A new application starts from `apps/_template` and inherits every row here without writing layout code.
rows: - id: DS-2001 name: The shell grid statement: >- `NexusShell` draws the skip link, the offline strip, `<main>` and the dock. The app's own left navigation (if any) is 248 px with a 52 px rail when collapsed; the collapse handle is centred on the divider (32 × 44 px, 200 ms). With no app navigation the shell draws its own 48 px rail (`dock="shell"`). components: ["@nexus/app-shell#NexusShell", "@nexus/app-shell#ShellDock"] source: [,, ] status: adopted proof: design-system-foundations--layout - id: DS-2002 name: The dock statement: >- Language · Apps · notifications · the user menu (Connected accounts, Settings, Sign out) sit in the `ShellDock` at the bottom of the left navigation (`dock="app"`) or in the shell rail. Menus open upward or beside the rail, follow the WAI-ARIA menu pattern and return focus to their trigger. `Alt+A` opens the launcher suite-wide. components: ["@nexus/app-shell#ShellDock"] source: [,, ] status: adopted proof: design-system-foundations--layout - id: DS-2003 name: The launcher statement: >- Static tiles for the applications (Chat · Spin · VibeBan · BI · Graph · Core) and a tile for each module the organization enabled (Map · Care · Forge); a disabled module is absent, never greyed. Each tile carries its app accent (DS-1004) and a one-line description; `resolveAppHref` sends cross-app links to the right origin. components: ["@nexus/app-shell#AppLauncher", "@nexus/app-shell#NEXUS_APPS"] source: [,, ""] status: adopted proof: design-system-foundations--app-accents - id: DS-2004 name: Page frame widths statement: >- Content sits in `PageFrame`: `standard` (max 1320 px — people, settings, detail pages) or `wide` (overview, matrix, audit, executions). 32 px of air above the header line; the body starts 16 px under the tabs. components: ["@nexus/ui/workbench#PageFrame"] source: ["", "R2"] status: adopted proof: kit-pageframe--dense-wide - id: DS-2005 name: The header line statement: >- Back arrow (icon, labelled) · title (ellipsis at 46 %) · ≤ 3 chips · Ask bar · ≤ 2 buttons + `⋯` on one 36 px row; under 720 px chips and actions wrap under the title. NexCore and NexChat keep their stacked frame (eyebrow · title · lead) for their own detail pages; every other app renders `layout="dense"`. components: ["@nexus/ui/workbench#PageLine", "@nexus/ui/workbench#PageFrame"] source: [,, " "] status: adopted proof: kit-pageframe--dense - id: DS-2006 name: Two levels, never tabs under tabs statement: >- The first level of a page is one underline tab row (`UrlTabs` / `LocalTabs`, state in `?tab=`). The second level is a left column of sections (`SideNav` in a `SideNavLayout`, 200 px, `aria-current`). A segmented control may switch views of the same data (list / board) and sits with the filters, never styled as tabs. components: ["@nexus/ui/workbench#UrlTabs", "@nexus/ui/workbench#LocalTabs", "@nexus/ui/workbench#SideNav", "@nexus/ui/workbench#SideNavLayout"] source: [,, " AC-2"] status: adopted proof: kit-navigation--left-nav - id: DS-2007 name: The Inspector column statement: >- Reading and editing one thing happens in the right-hand `Inspector`: 360–640 px, resizable by a keyboard separator, width persisted per app; Esc closes and focus returns to the opener. Creation opens the same panel empty (`FormInspector`). Under 720 px it becomes a sheet. There is one Inspector on a page. components: ["@nexus/ui/workbench#Inspector", "@nexus/ui/workbench#FormInspector"] source: ["", " R4", ] status: adopted proof: kit-inspector--detail - id: DS-2008 name: The Ask surface statement: >- Every app's header line carries the Ask bar: the minimised NexChat composer that sends to chat-api as a Project of that app and offers the hand-off chip and *Back to <app>* return. An app never builds its own chat input. components: ["@nexus/ui/ask#AskSurface"] source: ["", "",, ] status: adopted proof: conversation-ask-surface--the-bar-in-every-host - id: DS-2009 name: Theme and locale are attributes of `<html>` statement: >- `data-theme` (`light` · `graphite`) and `lang` (`en` · `uk`) are set on `<html>` by the shell from the person's device preference; `THEME_BOOT_SCRIPT` applies the theme before hydration. Graphite ships behind the token audit (`GRAPHITE_ENABLED`); the workshop renders it regardless so the audit has a place to happen. components: ["@nexus/app-shell#useTheme", "@nexus/app-shell#THEME_BOOT_SCRIPT", "@nexus/i18n#LocaleProvider"] source: [, " locale"] status: adopted proof: design-system-foundations--neutrals - id: DS-2010 name: Settings and shortcuts are sheets statement: >- Appearance, language, notifications and the keyboard reference open as `SettingsSheet` / `ShortcutsSheet` from the dock — one 400 px drawer, not a settings page per app. App-specific settings live on that app's Settings tab, under the same frame as everything else. components: ["@nexus/app-shell#SettingsSheet", "@nexus/app-shell#ShortcutsSheet"] source: [, ""] status: adopted proof: pending-s3b