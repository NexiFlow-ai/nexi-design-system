# · Design System Register · band 0 — Principles (DS-0xxx). Source of truth; `11-DESIGN_SYSTEM_REGISTER.md`
# and the workshop's "Design system / Principles" page are generated from it (scripts/design-system/build_register.py).
# A principle has no component; it is what every component and every screen is judged against. Rows are append-only;
# `status`: adopted (owner-approved, in force) · proposed (this epic, awaiting UAT-1) · legacy (kept for the record).
band: 0
title: Principles
lead: >- What the suite looks and behaves like, in fourteen sentences. Every row below is already an owner decision somewhere in Epics 001…025; the register gathers them so a new screen, a new application or a model building one has a single page to obey.
rows: - id: DS-0001 name: Black · white · graphite, one accent statement: >- The surface is graphite text on warm white (Light) or layered graphite (Graphite); there is one accent (`--nexus-accent`) and it marks only what is selected, running or focused — never navigation chrome, never a chip. Colour is never the only carrier of meaning: a status is a dot *and* a label. source: [, "", "AGENTS.md UX"] status: adopted proof: design-system-foundations--neutrals - id: DS-0002 name: Typography, spacing and borders over decorative colour statement: >- Hierarchy comes from size, weight and space. Borders separate; shadows are reserved for what floats. No gradients unless the product owner explicitly approves one; no illustration in product UI. source: ["AGENTS.md UX", ""] status: adopted proof: design-system-foundations--type - id: DS-0003 name: One header line statement: >- A resource page in every app except NexCore and NexChat has one header line — back arrow · title · chips · Ask bar · icon actions · `⋯` — and the content starts right under it. No eyebrow, no lead, no mode tabs, no static explanatory sentence. source: [,, ".cursor/rules/30-ux.mdc"] status: adopted proof: kit-pageframe--dense - id: DS-0004 name: A control that cannot change anything is not shown statement: >- A list that fits on one screen (12 rows at 1440 × 900) has no search, filter or view toggle; the row returns once the collection outgrows it and stays while a control is in use. A disabled control that can never be enabled is replaced by a sentence that says why (`Restriction`). source: [, ""] status: adopted proof: kit-forms--toolbar-row - id: DS-0005 name: Every read has its ladder statement: >- Every screen renders loading · empty · error · denied · offline · not found before its content, through the kit's `DataStateView`. Denied and not found look the same (the UI cannot tell "missing" from "not yours"); error and offline carry Retry; a spinner never sits over stale content. source: [,, " "] status: adopted proof: kit-states--ladder - id: DS-0006 name: Honest copy, two languages, one card statement: >- Every string is a key (uk = en); copy never names a mechanism, never invents a value, and says the same thing for not-found and not-yours. One card, one progress, one receipt per action — the conversation register's honesty rules apply to every surface, not only to chat. source: [" CR honesty", ".cursor/rules/35-nexchat-backbone.mdc"] status: adopted proof: kit-states--errors - id: DS-0007 name: Reversible asks inline, destructive asks by name statement: >- A reversible action confirms where it was taken — an inline `ActionPanel` that names the effect, one primary, Cancel. Only a destructive action (delete, revoke, archive with loss, remove a person) may take a modal, and it asks the person to type the name. Neither says "Are you sure?". A dirty form asks inline before discarding. source: [,, " R4"] status: adopted proof: kit-editbar--confirmation - id: DS-0008 name: Keyboard and screen reader first statement: >- Every interactive element has an accessible name; focus is visible (`:focus-visible`, 2 px); tabs, menus, switches, trees and separators use the WAI-ARIA pattern; the target is WCAG 2.2 AA and the workshop fails a story with a serious or critical axe violation. source: [, " a11y suites"] status: adopted proof: kit-navigation--tabs - id: DS-0009 name: Adopt, do not re-implement statement: >- A screen composes the kit. A new idiom — a new chip, a new panel, a new table — goes through the register as a Design Change Request before code; a duplicate of a kit component in an app is a fitness failure. source: [, " "] status: adopted proof: kit-button--all-variants - id: DS-0010 name: Tokens only statement: >- No raw colour, radius, shadow or font outside `packages/ui/src/tokens.css`. A screen that needs a new value proposes a token. Light and Graphite are one token contract; a component that hard-codes a colour breaks the Graphite audit. source: [, ] status: adopted proof: design-system-foundations--neutrals - id: DS-0011 name: One shell, one launcher, one context statement: >- Every application mounts `NexusShell` with the shared App Launcher, header, organization · project context and Ask surface. An app does not invent its own navigation chrome, theme switch or locale switch. source: ["AGENTS.md UX", " Ask everywhere",, ] status: adopted proof: design-system-foundations--layout - id: DS-0012 name: Motion is quiet statement: >- One shell transition (200 ms ease-out) and one progress pulse (600–900 ms); everything respects `prefers-reduced-motion`; nothing bounces, slides in from the edge or fades for decoration. source: [, "PulseStrip R2"] status: adopted proof: design-system-foundations--motion - id: DS-0013 name: Density is a contract, not a setting statement: >- `data-density="compact"` on `<html>` is the only way a screen gets denser; until the kit honours it the attribute is a no-op and no screen hand-rolls its own compact mode. source: [] status: adopted proof: design-system-foundations--layout - id: DS-0014 name: Fixtures are synthetic statement: >- Every name, number, address and document in the workshop and the catalogue is invented; nothing is copied from a tenant, a customer or a real person. The publication scan fails on a secret or a real-looking identifier. source: [, ] status: adopted proof: kit-datatable--populated